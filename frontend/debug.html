<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>DEBUG — Zamek Złej Królowej</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #c8b89a; font-family: 'Courier New', monospace; padding: 16px; overflow: hidden; }
    h1 { color: #d4a843; font-size: 0.9rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 14px; }

    #layout { display: flex; gap: 14px; height: calc(100vh - 52px); }

    /* KOLUMNA 1: graf */
    #graph-panel {
      flex: 1;
      border: 1px solid #3a2e1e;
      border-radius: 4px;
      background: #0d0900;
      overflow: hidden;
    }
    #graph-canvas { width: 100%; height: 100%; }

    /* KOLUMNA 2: stan gry */
    #info-panel {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    /* KOLUMNA 3: warianty obrazków + log */
    #image-panel {
      width: 380px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .tab-bar { display: flex; gap: 4px; margin-bottom: 6px; }
    .tab-btn {
      flex: 1; padding: 4px 0; font-family: 'Courier New', monospace; font-size: 0.68rem;
      letter-spacing: 1px; cursor: pointer; border-radius: 2px;
      background: #0d0900; border: 1px solid #3a2e1e; color: #5a4a30;
    }
    .tab-btn.active { background: #1a1000; border-color: #d4a843; color: #d4a843; }

    .panel-box {
      border: 1px solid #3a2e1e;
      border-radius: 4px;
      background: #0d0900;
      padding: 12px;
      flex-shrink: 0;
    }
    .panel-box.scrollable { overflow-y: auto; flex: 1; flex-shrink: 1; }
    .panel-box h2 { color: #d4a843; font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }

    .location-badge { background: #2a1800; border: 1px solid #d4a843; color: #d4a843; padding: 5px 8px; border-radius: 2px; font-size: 0.85rem; margin-bottom: 6px; }

    .flag-row { display: flex; justify-content: space-between; font-size: 0.72rem; padding: 3px 0; border-bottom: 1px solid #1a1200; }
    .flag-key { color: #7a6a50; }
    .flag-val { color: #a0c080; }
    .inv-item { font-size: 0.75rem; color: #a08040; padding: 2px 0; }

    /* Tabela wariantów */
    .loc-section { margin-bottom: 14px; }
    .loc-title { font-size: 0.7rem; color: #d4a843; margin-bottom: 4px; letter-spacing: 1px; }

    .variant-row {
      display: grid;
      grid-template-columns: 16px 1fr auto;
      gap: 6px;
      align-items: start;
      padding: 5px 6px;
      border-radius: 2px;
      margin-bottom: 3px;
      font-size: 0.7rem;
      border: 1px solid transparent;
    }
    .variant-row.active   { background: #1a1200; border-color: #5a3a10; }
    .variant-row.inactive { opacity: 0.7; }

    .variant-check { color: #d4a843; font-size: 0.8rem; }
    .variant-info  { display: flex; flex-direction: column; gap: 2px; }
    .variant-file  { color: #e8cc88; }
    .variant-label { color: #d0b888; font-size: 0.65rem; }
    .variant-reason { color: #a0e090; font-size: 0.65rem; font-style: italic; }
    .variant-reason.miss { color: #f08888; }

    .regen-btn {
      background: #1a0800;
      border: 1px solid #4a2a00;
      color: #8a6a30;
      padding: 2px 6px;
      font-size: 0.6rem;
      cursor: pointer;
      border-radius: 2px;
      font-family: 'Courier New', monospace;
      white-space: nowrap;
    }
    .regen-btn:hover { background: #2a1400; color: #d4a843; border-color: #8a4a00; }
    .regen-btn.loading { opacity: 0.5; pointer-events: none; }
    .cached-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
    .cached-yes { background: #4a8a4a; }
    .cached-no  { background: #8a3a3a; }

    /* Log */
    #event-log { font-size: 0.68rem; line-height: 1.6; }
    .log-entry { padding: 4px 0; border-bottom: 1px solid #1a1200; }
    .log-turn  { color: #d4a843; }
    .log-flag  { color: #a0c080; }
    .log-img   { color: #6a9a9a; }
    .log-text  { color: #7a6a50; }

    #refresh-info { font-size: 0.6rem; color: #2a2010; }

    #game-selector { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    #game-select { background: #0d0900; border: 1px solid #5a3a10; color: #d4a843; padding: 4px 8px; font-family: 'Courier New', monospace; font-size: 0.7rem; border-radius: 2px; cursor: pointer; flex: 1; }
    #game-switch-btn { background: #1a0800; border: 1px solid #8a4a00; color: #d4a843; padding: 4px 10px; font-family: 'Courier New', monospace; font-size: 0.7rem; border-radius: 2px; cursor: pointer; white-space: nowrap; }
    #game-switch-btn:hover { background: #2a1400; }
    #active-game-badge { font-size: 0.62rem; color: #6a9a9a; }

    .legend { display: flex; flex-direction: column; gap: 4px; font-size: 0.7rem; }
    .legend-row { display: flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-current { background: #d4a843; }
    .dot-normal  { background: #3a2e1e; border: 1px solid #7a6a50; }

    .focused-badge { font-size: 0.65rem; color: #6a9a9a; margin-top: 4px; }
    #teleport-btn { font-size: 0.65rem; background: #1a0a2a; border: 1px solid #6a3a9a; color: #c080ff; padding: 2px 8px; cursor: pointer; border-radius: 2px; margin-left: 8px; }
    #teleport-btn:hover { background: #2a1040; border-color: #9a60cc; }
    .loc-section.focused .loc-title { color: #6adfdf; }
    .loc-section:not(.focused) { opacity: 0.65; }

    /* KOLUMNA 4: Scripted solutions */
    #solutions-panel {
      width: 360px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .sol-npc-block { margin-bottom: 14px; }
    .sol-npc-title { font-size: 0.7rem; color: #6adfdf; margin-bottom: 2px; letter-spacing: 1px; }
    .sol-npc-loc   { font-size: 0.62rem; color: #5a4a30; margin-bottom: 5px; }
    .sol-npc-state { font-size: 0.62rem; }

    .sol-row {
      display: grid;
      grid-template-columns: 14px 1fr;
      gap: 5px;
      align-items: start;
      padding: 4px 6px;
      border-radius: 2px;
      margin-bottom: 3px;
      font-size: 0.68rem;
      border: 1px solid transparent;
    }
    .sol-row.pass  { background: #0d1a0d; border-color: #2a5a2a; }
    .sol-row.block { background: #1a0d0d; border-color: #5a2020; opacity: 0.8; }
    .sol-check     { font-size: 0.8rem; margin-top: 1px; }
    .sol-check.ok  { color: #4ac84a; }
    .sol-check.no  { color: #c84a4a; }
    .sol-id        { color: #d4a843; font-size: 0.65rem; }
    .sol-trigger   { color: #a09080; font-size: 0.63rem; font-style: italic; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sol-reason    { color: #c86060; font-size: 0.62rem; margin-top: 2px; }
    .sol-flags     { color: #6090c0; font-size: 0.62rem; margin-top: 1px; }
  </style>
</head>
<body>
<h1>🗺 Debug — Zamek Złej Królowej</h1>
<div id="layout">

  <!-- KOLUMNA 1: Graf -->
  <div id="graph-panel">
    <canvas id="graph-canvas"></canvas>
  </div>

  <!-- KOLUMNA 2: Stan gry -->
  <div id="info-panel">
    <div class="panel-box">
      <h2>Aktywna gra</h2>
      <div id="game-selector">
        <select id="game-select"></select>
        <button id="game-switch-btn">Załaduj</button>
      </div>
      <div id="active-game-badge"></div>
    </div>
    <div class="panel-box">
      <h2>Lokacja gracza</h2>
      <div class="location-badge" id="current-loc">—</div>
      <div id="turn-info" style="font-size:0.65rem;color:#5a4a30"></div>
      <button id="reset-game-btn" style="margin-top:10px;width:100%;background:#1a0000;border:1px solid #6a1a1a;color:#cc4444;padding:5px;font-family:'Courier New',monospace;font-size:0.65rem;cursor:pointer;border-radius:2px;letter-spacing:1px">⚠ Reset gry do startu</button>
    </div>
    <div class="panel-box">
      <h2>Ekwipunek</h2>
      <div id="inventory"></div>
    </div>
    <div class="panel-box">
      <h2>Flagi</h2>
      <div id="flags"></div>
    </div>
    <div class="panel-box">
      <h2>Legenda</h2>
      <div class="legend">
        <div class="legend-row"><div class="dot dot-current"></div> Gracz tu jest</div>
        <div class="legend-row"><div class="dot dot-normal"></div> Lokacja</div>
        <div class="legend-row"><div style="width:20px;height:2px;background:#4a8a4a"></div> Otwarte [1]</div>
        <div class="legend-row"><div style="width:20px;height:0;border-top:2px dashed #8a2020"></div> Zablokowane [0]</div>
      </div>
    </div>
    <div id="refresh-info">Auto-odświeżanie co 2s • Klawisz 0 = reset zoom</div>
  </div>

  <!-- KOLUMNA 3: Warianty obrazków + Log -->
  <div id="image-panel">
    <div class="panel-box scrollable">
      <h2>Warianty obrazków <span id="focused-badge" class="focused-badge"></span> <button id="teleport-btn" style="display:none"></button></h2>
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-las" onclick="switchTab('las')">🌲 LAS</button>
        <button class="tab-btn" id="tab-miasto" onclick="switchTab('miasto')">🏘️ MIASTO</button>
      </div>
      <div id="variants-table"></div>
    </div>
    <div class="panel-box scrollable">
      <h2>Log zdarzeń</h2>
      <div id="event-log"><span style="color:#3a2e1e">Brak zdarzeń</span></div>
    </div>
  </div>

  <!-- KOLUMNA 4: Scripted solutions -->
  <div id="solutions-panel">
    <div class="panel-box scrollable">
      <h2>Scripted solutions — aktualny stan</h2>
      <div id="solutions-table"><span style="color:#3a2e1e">Ładowanie…</span></div>
    </div>
  </div>

</div>

<script>
let NODE_POS_LAS = {};
let NODE_POS_MIASTO = {};

const NODE_POS = new Proxy({}, {
  get(_, key) {
    return activeTab === 'miasto' ? NODE_POS_MIASTO[key] : NODE_POS_LAS[key];
  }
});

async function loadMapConfig() {
  try {
    const res = await fetch('/api/map-config');
    const cfg = await res.json();
    NODE_POS_LAS    = cfg.levels?.las?.nodes    || {};
    NODE_POS_MIASTO = cfg.levels?.miasto?.nodes || {};
  } catch(e) {
    console.error('Błąd ładowania map-config:', e);
  }
}

async function loadGames() {
  const res = await fetch('/api/debug/games');
  const data = await res.json();
  const sel = document.getElementById('game-select');
  sel.innerHTML = data.games.map(g =>
    `<option value="${g}" ${g === data.active ? 'selected' : ''}>${g}</option>`
  ).join('');
  document.getElementById('active-game-badge').textContent = `aktywna: ${data.active}`;
}

async function switchGame() {
  const name = document.getElementById('game-select').value;
  const res = await fetch('/api/debug/set-game', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ game: name }),
  });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('active-game-badge').textContent = `aktywna: ${data.active}`;
    addLog(`🎮 Załadowano grę: <span class="log-flag">${data.active}</span>`);
    await loadMapConfig();
    scale = 1; panX = 0; panY = 0;
    await refresh();
    updateVariants();
  }
}

// ── GRAF ──────────────────────────────────────────
const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
let scale = 1, panX = 0, panY = 0, isPanning = false, lastMX = 0, lastMY = 0, lastData = null;
let focusedNode = null;
let didPan = false;

function resize() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
window.addEventListener('resize', () => { resize(); if (lastData) draw(lastData); });
resize();

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const delta = e.deltaY < 0 ? 1.12 : 1/1.12;
  panX = mx - (mx - panX) * delta; panY = my - (my - panY) * delta;
  scale = Math.max(0.3, Math.min(4, scale * delta));
  if (lastData) draw(lastData);
}, { passive: false });

canvas.addEventListener('mousedown', e => { isPanning = true; didPan = false; lastMX = e.clientX; lastMY = e.clientY; canvas.style.cursor = 'grabbing'; });
canvas.addEventListener('mousemove', e => {
  if (!isPanning) return;
  const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didPan = true;
  panX += dx; panY += dy;
  lastMX = e.clientX; lastMY = e.clientY;
  if (lastData) draw(lastData);
});
canvas.addEventListener('mouseup', e => {
  isPanning = false; canvas.style.cursor = 'grab';
  if (!didPan && lastData) handleCanvasClick(e);
});
canvas.addEventListener('mouseleave', () => { isPanning = false; canvas.style.cursor = 'grab'; });
canvas.style.cursor = 'grab';
document.addEventListener('keydown', e => {
  if (e.key === '0') { scale=1; panX=0; panY=0; if (lastData) draw(lastData); }
  if (e.key === 'Escape') { focusedNode = null; if (lastData) { draw(lastData); applyFocus(); } }
});

function handleCanvasClick(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left - panX) / scale;
  const my = (e.clientY - rect.top  - panY) / scale;
  const W = canvas.width, H = canvas.height;

  let hit = null;
  lastData.nodes.forEach(n => {
    const p = NODE_POS[n.id];
    if (!p) return;
    const nx = p.x * W, ny = p.y * H;
    if (Math.sqrt((mx-nx)**2 + (my-ny)**2) < 28) hit = n.id;
  });

  focusedNode = (hit === focusedNode) ? null : hit; // toggle
  draw(lastData);
  applyFocus();
}

function applyFocus() {
  document.querySelectorAll('.loc-section').forEach(el => {
    if (!focusedNode) {
      el.classList.remove('focused');
    } else {
      el.classList.toggle('focused', el.dataset.locId === focusedNode);
    }
  });
  const badge = document.getElementById('focused-badge');
  if (badge) badge.textContent = focusedNode ? `Fokus: ${focusedNode} (Esc = wyczyść)` : '';

  const teleportBtn = document.getElementById('teleport-btn');
  if (teleportBtn) {
    if (focusedNode) {
      teleportBtn.style.display = 'inline-block';
      teleportBtn.textContent = `⚡ Teleportuj → ${focusedNode}`;
      teleportBtn.onclick = () => teleport(focusedNode);
    } else {
      teleportBtn.style.display = 'none';
    }
  }
}

async function teleport(locId) {
  const res = await fetch('/api/debug/teleport', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ location: locId }),
  });
  if (res.ok) {
    addLog(`⚡ Teleport → <span class="log-flag">${locId}</span>`);
    await refresh();
  }
}

function draw(data) {
  lastData = data;
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.save(); ctx.translate(panX, panY); ctx.scale(scale, scale);

  const pos = {};
  data.nodes.forEach(n => {
    const p = NODE_POS[n.id];
    if (!p) return;
    pos[n.id] = { x: p.x * W, y: p.y * H, label: n.label, current: n.current };
  });

  // Scalamy pary A↔B w jedną linię (kolor = min waga — czerwona jeśli któryś kierunek zablokowany)
  const drawn = new Set();
  data.edges.forEach(e => {
    const from = pos[e.from], to = pos[e.to];
    if (!from || !to || to.y < 20 || from.y < 20) return;
    const pairKey = [e.from, e.to].sort().join('|');
    if (drawn.has(pairKey)) return;
    drawn.add(pairKey);

    const reverse = data.edges.find(r => r.from === e.to && r.to === e.from);
    const minWeight = Math.min(e.weight, reverse ? reverse.weight : 1);
    const open = minWeight === 1;

    const dx = to.x - from.x, dy = to.y - from.y;
    ctx.save();
    ctx.strokeStyle = open ? '#4a8a4a' : '#8a2020';
    ctx.lineWidth = open ? 2 : 1.5;
    if (!open) ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
    ctx.setLineDash([]);
    const mx2 = (from.x + to.x) / 2, my2 = (from.y + to.y) / 2;
    ctx.fillStyle = open ? '#4a8a4a' : '#8a2020';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(`[${minWeight}]`, mx2 + 10, my2 - 4);
    ctx.restore();
  });

  Object.entries(pos).forEach(([id, p]) => {
    if (p.y < 20) return;
    ctx.save();
    const isFocused = focusedNode === id;
    if (p.current) { ctx.shadowColor = '#d4a843'; ctx.shadowBlur = 20; }
    if (isFocused)  { ctx.shadowColor = '#4adada'; ctx.shadowBlur = 24; }
    ctx.beginPath(); ctx.arc(p.x, p.y, 28, 0, Math.PI*2);
    ctx.fillStyle = p.current ? '#2a1800' : '#111008'; ctx.fill();
    ctx.strokeStyle = p.current ? '#d4a843' : isFocused ? '#4adada' : '#5a4a30';
    ctx.lineWidth = p.current ? 2.5 : isFocused ? 2 : 1; ctx.stroke(); ctx.shadowBlur = 0;
    if (p.current) { ctx.font = '16px serif'; ctx.textAlign = 'center'; ctx.fillText('🧙', p.x, p.y-6); }
    ctx.fillStyle = p.current ? '#d4a843' : '#7a6a50';
    ctx.font = `${p.current ? 'bold ' : ''}11px Courier New`; ctx.textAlign = 'center';
    p.label.split(' ').forEach((w, i) => ctx.fillText(w, p.x, p.y+(p.current?12:6)+i*13));
    ctx.restore();
  });

  ctx.restore();
}

// ── STAN GRY ──────────────────────────────────────
function updateInfo(data) {
  const locNode = data.nodes.find(n => n.current);
  document.getElementById('current-loc').textContent = locNode ? locNode.label : '—';
  document.getElementById('turn-info').textContent = `Tura: ${data.state.turn}`;
  const inv = data.state.inventory;
  document.getElementById('inventory').innerHTML = inv.length
    ? inv.map(i => `<div class="inv-item">▸ ${i}</div>`).join('')
    : '<div class="inv-item" style="color:#3a2e1e">(pusty)</div>';
  document.getElementById('flags').innerHTML = Object.entries(data.flags)
    .map(([k,v]) => `<div class="flag-row"><span class="flag-key">${k}</span><span class="flag-val">${v}</span></div>`)
    .join('');
}

// ── WARIANTY OBRAZKÓW ─────────────────────────────
let prevFlags = null;
const eventLog = [];

const MIASTO_LOCS = new Set(['pokoj_karczmy','karczma','ulica','ratusz','targowisko','zaulek','brama_miasta','transport_wiezniarski']);
let activeTab = 'las';
let lastVariantsData = null;

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-las').classList.toggle('active', tab === 'las');
  document.getElementById('tab-miasto').classList.toggle('active', tab === 'miasto');
  scale = 1; panX = 0; panY = 0;
  if (lastData) draw(lastData);
  if (lastVariantsData) renderVariants(lastVariantsData);
}

function renderVariants(locs) {
  const el = document.getElementById('variants-table');
  const filtered = locs.filter(loc => activeTab === 'miasto' ? MIASTO_LOCS.has(loc.loc_id) : !MIASTO_LOCS.has(loc.loc_id));
  el.innerHTML = filtered.map(loc => `
    <div class="loc-section" data-loc-id="${loc.loc_id}">
      <div class="loc-title">📍 ${loc.loc_name}</div>
      ${loc.variants.map(v => `
        <div class="variant-row ${v.active ? 'active' : 'inactive'}">
          <span class="variant-check">${v.active ? '✓' : '·'}</span>
          <div class="variant-info">
            <span class="variant-file">
              <span class="cached-dot ${v.cached ? 'cached-yes' : 'cached-no'}"></span>
              ${v.file}.png
            </span>
            <span class="variant-label">${v.label}</span>
            <span class="variant-reason ${v.reason.includes('✗') ? 'miss' : ''}">${v.reason}</span>
          </div>
          <button class="regen-btn" onclick="regen('${loc.loc_id}','${v.file}',this)">⟳</button>
        </div>
      `).join('')}
    </div>
  `).join('');
  if (focusedNode) applyFocus();
}

async function updateVariants() {
  const res = await fetch('/api/debug/images');
  lastVariantsData = await res.json();
  renderVariants(lastVariantsData);
}

async function regen(locId, fileId, btn) {
  btn.classList.add('loading');
  btn.textContent = '...';
  await fetch(`/api/location-image/${locId}?force=true`);
  addLog(`⟳ Zregenerowano: <span class="log-img">${fileId}.png</span> dla lokacji ${locId}`);
  btn.classList.remove('loading');
  btn.textContent = '⟳';
  updateVariants();
}

// ── LOG ZDARZEŃ ───────────────────────────────────
function addLog(html) {
  const turn = lastData ? lastData.state.turn : '?';
  eventLog.unshift(`<div class="log-entry"><span class="log-turn">[t${turn}]</span> ${html}</div>`);
  if (eventLog.length > 50) eventLog.pop();
  document.getElementById('event-log').innerHTML = eventLog.join('') || '<span style="color:#3a2e1e">Brak zdarzeń</span>';
}

function detectFlagChanges(newFlags) {
  if (!prevFlags) { prevFlags = {...newFlags}; return; }
  for (const [k, v] of Object.entries(newFlags)) {
    if (prevFlags[k] !== v) {
      addLog(`🚩 Flaga zmieniona: <span class="log-flag">${k}</span> = <span class="log-img">${prevFlags[k] ?? '(brak)'}</span> → <span class="log-flag">${v}</span>`);
      updateVariants();
    }
  }
  prevFlags = {...newFlags};
}

function detectLocationChange(newLoc, nodes) {
  if (!prevFlags) return;
  const prevLoc = Object.keys(prevFlags).length ? null : null;
}

let prevLocation = null;
function detectLocation(data) {
  const cur = data.nodes.find(n => n.current);
  if (!cur) return;
  if (cur.id !== prevLocation) {
    if (prevLocation !== null)
      addLog(`🚶 Lokacja: <span class="log-text">${prevLocation}</span> → <span class="log-flag">${cur.id}</span>`);
    prevLocation = cur.id;
    updateVariants();
  }
}

// ── GŁÓWNA PĘTLA ──────────────────────────────────
async function refresh() {
  try {
    const res = await fetch('/api/debug/graph');
    const data = await res.json();
    resize();
    draw(data);
    updateInfo(data);
    detectFlagChanges(data.flags);
    detectLocation(data);
  } catch(e) { console.error(e); }
}

document.getElementById('reset-game-btn').addEventListener('click', async () => {
  if (!confirm('Reset gry do ustawień startowych?')) return;
  await fetch('/api/reset', { method: 'POST' });
  addLog('🔄 Gra zresetowana do startu');
  await refresh();
  updateVariants();
});

// ── SCRIPTED SOLUTIONS ────────────────────────────
async function updateSolutions() {
  const res = await fetch('/api/debug/solutions');
  const npcs = await res.json();
  const el = document.getElementById('solutions-table');
  if (!npcs.length) { el.innerHTML = '<span style="color:#3a2e1e">Brak NPC</span>'; return; }
  el.innerHTML = npcs.map(npc => `
    <div class="sol-npc-block">
      <div class="sol-npc-title">⚔ ${npc.npc_name}</div>
      <div class="sol-npc-loc">${npc.loc_name} · stan: <span style="color:#a0c080">${npc.npc_state}</span></div>
      ${npc.solutions.map(s => `
        <div class="sol-row ${s.passes ? 'pass' : 'block'}">
          <span class="sol-check ${s.passes ? 'ok' : 'no'}">${s.passes ? '✓' : '✗'}</span>
          <div>
            <div class="sol-id">${s.id}</div>
            <div class="sol-trigger">${s.trigger}</div>
            ${s.reason ? `<div class="sol-reason">⛔ ${s.reason}</div>` : ''}
            ${s.flags && Object.keys(s.flags).length ? `<div class="sol-flags">→ ${JSON.stringify(s.flags)}</div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

document.getElementById('game-switch-btn').addEventListener('click', switchGame);

loadGames();
loadMapConfig().then(() => {
  updateVariants();
  updateSolutions();
  refresh();
  setInterval(refresh, 2000);
  setInterval(updateSolutions, 2000);
});
</script>
