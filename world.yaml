title: "Zamek Złej Królowej"
intro: |
  Stoisz na skraju mrocznego lasu. Gdzieś w oddali widać wieże zamku Złej Królowej.
  Musisz ją powstrzymać, zanim rzuci swój czar na całe królestwo.
  Co robisz?

locations:
  las:
    name: "Mroczny Las"
    image_variants:
      - file: "las"
        condition: null
        label: "Mroczny las (domyślny)"
        prompt_extra: "gęsty mroczny las, stare dęby, blade światło przez korony, mgła przy ziemi"
    description: |
      Jesteś w gęstym, mrocznym lesie. Stare dęby zasłaniają niebo, przez ich korony
      przebijają się jedynie blade promienie światła. Między korzeniami walają się
      stare liście. Czujesz zapach wilgoci i mchu.
      Na północy słyszysz szum rzeki. Na wschodzie widać przebłyski czegoś metalicznego
      między krzakami. Ścieżka na południe prowadzi z powrotem do wioski.
    description_with_path: |
      Jesteś w gęstym, mrocznym lesie. Na północy szum rzeki, na wschodzie polana.
      Więzień wspomniał o ukrytej ścieżce na zachodzie — teraz gdy wiesz gdzie szukać,
      dostrzegasz ją między starymi dębami. Prowadzi w głąb lasu.
    exits:
      północ: most
      wschód: polana
      południe: null
      zachód: domek_pustelnika  # dostępne tylko gdy flaga hidden_path_unlocked = true
    exits_locked:
      zachód: "Nie widzisz żadnej ścieżki na zachodzie — tylko gęste zarośla."
    items:
      - id: kij
        name: "stary kij"
        description: "Gruby, dębowy kij. Niezbyt elegancki, ale solidny."
        takeable: true
    npcs: []
    atmosphere: "mroczny, niepokojący, cichy poza szumem wiatru"

  polana:
    name: "Słoneczna Polana"
    image_variants:
      - file: "polana"
        condition: null
        label: "Słoneczna polana (domyślna)"
        prompt_extra: "słoneczna polana, wysoka trawa, omszały głaz pośrodku, jasne światło, spokojny klimat"
    description: |
      Wychodząc z lasu trafiasz na małą, słoneczną polanę. Trawa jest tu wysoka,
      a pośrodku sterczy stary, omszały głaz. Przy głazie leży coś błyszczącego.
      Na zachodzie ciemnieje las. Więcej ścieżek tu nie ma.
    exits:
      zachód: las
    items:
      - id: miecz
        name: "zardzewiały miecz"
        description: |
          Stary miecz z zardzewiałym ostrzem. Widać na nim wyryte runy.
          Mimo rdzy trzyma się całkiem dobrze — ostrze jest wciąż sprawne.
        takeable: true
      - id: sakiewka
        name: "sakiewka ze złotem"
        description: "Skórzana sakiewka. W środku brzęczą monety — co najmniej 10 złotych."
        takeable: true
    npcs: []
    atmosphere: "jasna, spokojna, kontrastuje z lasem"

  most:
    name: "Most nad Rzeką Mgieł"
    image_variants:
      - file: "most_troll"
        condition: {flag: "troll_state", value: "blokuje_most"}
        label: "Troll blokuje most"
        prompt_extra: "zbliżenie na ogromnego szarego trolla, kamienna skóra, złośliwe małe oczy, rozmyty kamienny most i czarna rzeka w tle, dramatyczne oświetlenie"
      - file: "most"
        condition: null
        label: "Most spokojny (domyślny)"
        prompt_extra: "stary kamienny most nad czarną rzeką mgieł, brak postaci, mroczna atmosfera, mgła unosi się nad wodą"
    description: |
      Stoisz przed starym kamiennym mostem przerzuconym nad głęboką, mroczną rzeką.
      Woda jest czarna i spokojna — nie widać dna. Most wygląda solidnie, ale na
      jego środku siedzi ogromny troll. Ma szarą, kamienistą skórę, wielkie pięści
      i małe, złośliwe oczka. Kiedy cię widzi, wstaje i warczy:
      "Nikt nie przejdzie przez mój most! Chyba że... hehe."
      Za mostem, na północy, widać bramę zamku.
    exits:
      południe: las
      północ: zamek  # zablokowane przez trolla dopóki nie rozwiązano zagadki
    items: []
    npcs:
      - id: troll
        name: "Troll Strażnik"
        description: |
          Ogromny troll o szarej skórze twardej jak kamień. Ma około 3 metrów wzrostu.
          Jest głupi ale przebiegły w swojej głupocie. Lubi złoto i jedzenie.
          W nocy — jak wszystkie trolle — śpi bardzo głęboko (trolle śpią od zachodu
          do wschodu słońca, budzą się na dźwięk głośnych kroków).
        state: "blokuje_most"
        scripted_solutions:
          - id: walka
            trigger: "gracz ma miecz i atakuje trolla"
            outcome: |
              Troll widzi miecz i cofa się. Runy na mieczu świecą się złowrogo.
              "Stary miecz runiczny! Nie chcę kłopotów..." — mruczy i ustępuje z drogi.
              Możesz przejść przez most.
            result: "troll_pokonany"
          - id: przekupstwo
            trigger: "gracz oferuje złoto lub sakiewkę"
            outcome: |
              Troll widzi złoto i jego oczy robią się wielkie. "Złoooto! Daj, daj!"
              Wyrywa sakiewkę z twoich rąk i odchodzi pod most, przeliczając monety.
              Droga wolna.
            result: "troll_przekupiony"
        creative_solutions_hint: |
          Troll to klasyczny fantastyczny archetyp. Trolle śpią w nocy, boją się
          ognia, są głupie i można je przechytrzyć. Możliwe niekanoniczne rozwiązania
          które WARTO zaakceptować jeśli gracz jest kreatywny:
          - czekanie do nocy i przekradanie się (troll śpi)
          - rozproszenie uwagi trolla (rzucenie czegoś w bok)
          - podstęp słowny (jeśli bardzo przekonujący)
          - użycie kija do wywołania hałasu z drugiej strony mostu
          Oceniaj kreatywność gracza — jeśli plan ma logiczny sens w tym świecie,
          pozwól mu zadziałać. Gra ma być uczciwa wobec pomysłowego gracza.

  zamek:
    name: "Brama Zamku Złej Królowej"
    image_variants:
      - file: "zamek_otwarta"
        condition: {flag: "brama_state", value: "otwarta"}
        label: "Brama otwarta"
        prompt_extra: "potężna czarna brama zamku uchylona, fioletowe światło gaśnie, mroczne mury, gargulce na wieżyczkach"
      - file: "zamek_wiezien"
        condition: {flag: "wiezien_state", value: "uwolniony"}
        label: "Brama z pustą klatką"
        prompt_extra: "potężna czarna brama zamku, fioletowy magiczny symbol pulsuje, pusta otwarta klatka przy murze"
      - file: "zamek"
        condition: null
        label: "Brama zamknięta z więźniem (domyślna)"
        prompt_extra: "potężna czarna brama zamku, fioletowy magiczny symbol pulsuje, żelazna klatka z więźniem przy murze, mroczne mury, gargulce"
    description: |
      Stoisz przed potężną bramą zamku. Czarne mury wznoszą się wysoko w niebo,
      a z wieżyczek obserwują cię nieruchome gargulce. Brama jest zamknięta —
      na jej środku świeci się dziwny, fioletowy symbol. To magiczny zamek.
      Przy murze, w żelaznej klatce, siedzi skulony człowiek w łachmanach.
      Patrzy na ciebie z nadzieją w oczach.
    exits:
      południe: most
      północ: null  # otwiera się po wypowiedzeniu hasła
    items: []
    npcs:
      - id: wiezien
        name: "Więzień"
        description: |
          Wychudzony mężczyzna w podartych ubraniach. Przedstawia się jako Benedykt,
          dawny leśnik. Mówi że siedzi tu od tygodnia — złapała go straż królowej
          gdy zbierał zioła w lesie. Zna te okolice jak własną kieszeń.
        state: "uwięziony"
        scripted_solutions:
          - id: uwolnienie
            trigger: "gracz otwiera klatkę, wyważa zamek, używa kija do wyważenia kraty lub w inny sposób uwalnia więźnia"
            outcome: |
              Klatka otwiera się z głośnym zgrzytem. Benedykt wychodzi, prostuje plecy
              i ściska twoją dłoń. 'Dziękuję! Słuchaj — w lesie, między starymi dębami
              jest ukryta ścieżka na zachód. Prowadzi do domku pustelnika Hieronima.
              On zna każdy sekret tej okolicy. Może wie jak otworzyć tę bramę.'
              Benedykt znika w lesie.
            result: "wiezien_uwolniony"
            flags: {"wiezien_state": "uwolniony", "hidden_path_unlocked": true}
        creative_solutions_hint: |
          Klatka ma zwykły żelazny zamek (nie magiczny). Można ją otworzyć siłą,
          wyważyć kijem, złamać rdzewiejące zawiasy, lub znaleźć inny fizyczny sposób.
          Więzień sam nie może się uwolnić — jest zbyt słaby. Akceptuj każde logiczne
          fizyczne rozwiązanie — to nie jest zagadka magiczna.

      - id: magiczna_brama
        name: "Magiczna Brama"
        description: |
          Brama zamknięta potężnym zaklęciem Złej Królowej. Fioletowy symbol na środku
          pulsuje miarowo. Próby wyważenia, rozbicia czy wspinaczki kończą się
          magicznym odpychaniem — niewidzialna siła odrzuca każdego kto dotknie bramy
          bez znajomości hasła. Hasło jest znane tylko nielicznym — królowa zmieniła je
          niedawno po ucieczce ostatniego więźnia.
        state: "zamknięta"
        scripted_solutions:
          - id: haslo
            trigger: "gracz mówi 'Bum bara doom' lub wypowiada to hasło przy bramie"
            outcome: |
              Fioletowy symbol gaśnie. Przez chwilę panuje cisza, po czym brama
              otwiera się powoli z głębokim, kamiennym zgrzytem. Droga do zamku stoi otworem.
            result: "brama_otwarta"
            flags: {"brama_state": "otwarta"}
          - id: zle_haslo
            trigger: "gracz próbuje innego hasła lub zaklęcia"
            outcome: |
              Symbol pulsuje mocniej i odrzuca cię niewidzialną siłą o krok do tyłu.
              'Błędne hasło' — słyszysz zimny głos jakby z samej bramy.
            result: "brak_zmiany"
        creative_solutions_hint: |
          Brama jest NAPRAWDĘ magicznie zamknięta — fizyczne ataki, wspinaczka,
          podkopy są neutralizowane przez zaklęcie. Jedynym sposobem jest hasło.
          Możesz jednak zaakceptować bardzo kreatywne magiczne podejście jeśli gracz
          ma jakiś magiczny przedmiot (aktualnie nie ma) lub znajdzie lukę w logice zaklęcia.
          Domyślnie: bez hasła nie wejdzie.
    atmosphere: "złowieszczy, monumentalny, magiczny — fioletowe światło pulsuje na bramie"

  domek_pustelnika:
    name: "Domek Pustelnika Hieronima"
    image_variants:
      - file: "domek_pustelnika"
        condition: null
        label: "Chatka pustelnika (domyślna)"
        prompt_extra: "mała drewniana chatka w lesie, dach pokryty mchem, rzędy ziół w glinianych donicach przy wejściu, ciepłe światło z okna"
    description: |
      Ukryta ścieżka prowadzi cię przez gęsty las do małej, drewnianej chatki.
      Dach pokryty jest mchem, a przy wejściu rosną rzędy ziół w glinianych donicach.
      Przy drzwiach stoi stary mężczyzna z długą białą brodą. Mierzy cię uważnym wzrokiem.
      'Rzadko mam gości' — mówi. 'Czego szukasz, wędrowcze?'
    exits:
      wschód: las
    items:
      - id: zioła
        name: "zioła lecznicze"
        description: "Pęczek świeżych ziół — dziurawiec, krwawnik i coś czego nie rozpoznajesz. Rosną przy chatce pustelnika."
        takeable: true
    npcs:
      - id: pustelnik
        name: "Pustelnik Hieronim"
        description: |
          Stary, mądry pustelnik który żyje w lesie od trzydziestu lat. Zna każdy
          sekret okolicy — w tym hasło do bramy zamku, które podsłuchał od straży
          królowej wiele lat temu. Jest życzliwy ale nie daje nic za darmo —
          cierpi na reumatyzm i jego zapasy ziół się skończyły.
        state: "czeka_na_pomoc"
        scripted_solutions:
          - id: zioła_zebrane
            trigger: "gracz daje pustelnikowi zioła lecznicze które zebrał przy chatce"
            outcome: |
              Pustelnik bierze zioła i kiwa głową z zadowoleniem. 'Ah, dziurawiec i krwawnik —
              właśnie tego mi brakowało. W podzięce powiem ci coś cennego.'
              Siada na pieńku i ścisza głos: 'Hasło do bramy zamku to... Bum bara doom.
              Pamiętaj — królowa tego nie zmienia, bo je zapomina.'
              Pustelnik chichocze pod wąsem.
            result: "haslo_zdradzone"
            flags: {"haslo_znane": true, "pustelnik_state": "pomoglismy"}
          - id: bez_ziol
            trigger: "gracz pyta o hasło bez przyniesienia ziół"
            outcome: |
              Pustelnik kręci głową. 'Informacje mają swoją cenę, przyjacielu.
              Moje stawy bolą i skończyły mi się zioła. Zbierasz zioła? Rosną tu niedaleko,
              przy mojej chatce. Przyniesiesz mi pęczek, to pogadamy.'
            result: "brak_zmiany"
        creative_solutions_hint: |
          Pustelnik jest uczciwy i życzliwy — nie jest wrogiem. Można go przekonać
          innymi sposobami jeśli gracz jest kreatywny: np. zaproponować złoto zamiast ziół
          (pustelnik powie że nie potrzebuje pieniędzy, tylko lekarstwa), albo bardzo
          ciekawie opowiedzieć swoją historię (pustelnik jest ciekawski — może się skusić).
          Zioła rosną tuż przy chatce — gracz powinien je zauważyć i wziąć.
    atmosphere: "spokojny, ciepły, zapach ziół i dymu z kominka — kontrast z mrocznym lasem"
