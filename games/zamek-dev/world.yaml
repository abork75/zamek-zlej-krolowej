  straznik_duch_wladcy:
    name: "Korytarz Podziemi"
    image_variants:
      - file: "straznik_duch_wladcy_przepuscil"
        condition: {flag: straznik_przepuscil, value: true}
        label: "Pusty korytarz, duch zniknął"
        prompt_extra: "usuń widmową postać strażnika z korytarza, pusty mroczny kamienny korytarz, reszta sceny bez zmian"
      - file: "straznik_duch_wladcy"
        base: true
        condition: null
        label: "Duch strażnika blokuje przejście"
        prompt_extra: "mroczny kamienny korytarz podziemny, widmowa, na wpół przezroczysta postać strażnika w starożytnej zbroi, niebieskawa poświata, zimna, złowieszcza atmosfera"
    description_variants:
      - condition: {flag: straznik_przepuscil, value: true}
        description: |
          Kamienny korytarz prowadzi w głąb podziemi. Duch strażnika
          zniknął — korytarz jest pusty i cichy, tylko echo Twoich
          kroków odbija się od ścian.
      - condition: null
        description: |
          Kamienny korytarz prowadzi w głąb podziemi. Pośrodku stoi widmowa
          postać w starożytnej zbroi — strażnik dawno umarłego władcy tych
          podziemi. Jego puste oczodoły śledzą każdy twój ruch. "Nikt nie
          przejdzie bez właściwego imienia" — szepcze głosem jak wiatr
          w pustych korytarzach.
    exits:
      południe: wejscie_podziemi
      północ:
        target: czarodziejka
        requires: {flag: straznik_przepuscil, value: true}
        blocked_message: "Widmowy strażnik zagradza drogę, nieprzenikniony. Nie znasz właściwego imienia."
    items: []
    npcs:
      - id: straznik_duch
        name: "Duch Strażnika Władcy"
        description: |
          Widmo dawnego strażnika, związane z tym miejscem od wieków. Nie
          reaguje na groźby, przekupstwo ani walkę — to duch, nie żywa
          istota. Reaguje WYŁĄCZNIE na wypowiedzenie właściwego imienia.
        state: "blokuje"
        unavailable_states:
          przepuscil: "Duch strażnika rozstąpił się i zniknął w cieniu — droga na północ stoi otworem."
        scripted_solutions:
          - id: haslo_ivan
            exact_sequence: ["ivan"]
            action_hint: "gracz musi wypowiedzieć imię 'Ivan' — nic innego (walka, groźba, inne imię) nie zadziała"
            trigger: "gracz wypowiada imię 'Ivan'"
            outcome: |
              Na dźwięk imienia duch nieruchomieje. Przez chwilę w pustych
              oczodołach błyska coś jakby rozpoznanie. Bez słowa rozstępuje
              się i znika w cieniu korytarza.
            flags: {straznik_przepuscil: true}
        no_match_messages:
          - "Duch nie reaguje — stoi nieruchomo, zagradzając drogę."
          - "Widmo milczy, nieprzenikniony chłód bije od jego zbroi."
          - "Nic się nie zmienia. Duch dalej blokuje przejście na północ."
        creative_solutions_hint: |
          To duch — nie da się go pokonać siłą, przekupić ani przechytrzyć.
          Jedyne co działa to wypowiedzenie właściwego imienia: "Ivan".
    atmosphere: "zimno, cisza, widmowa poświata"

  czarodziejka:
    name: "Komnata Czarodziejki"
    image_variants:
      - file: "czarodziejka"
        base: true
        condition: null
        label: "Czarodziejka, której imienia nikt nie zna"
        prompt_extra: "podziemna komnata oświetlona magicznym błękitnym światłem, tajemnicza kobieta w szacie utkanej z piasku i gwiazd, otoczona unoszącymi się run ami, mistyczna, spokojna atmosfera"
    description: |
      Komnata wykuta w litej skale, oświetlona miękkim, błękitnym światłem
      bez wyraźnego źródła. Pośrodku stoi kobieta, której twarzy nie
      sposób zapamiętać, choć patrzysz na nią wprost. "Czekałam na
      kogoś takiego jak ty" — mówi cicho. Jej wzrok pada na twój
      zardzewiały miecz. "Ale ten miecz jeszcze nie jest gotowy. Idź na
      wschód — tam znajdziesz kowala."
    exits:
      południe: straznik_duch_wladcy
      wschód: kowal
    items: []
    npcs: []
    atmosphere: "błękitna poświata, spokój, ciężar czekającej historii"

  kowal:
    name: "Kuźnia Podziemi"
    image_variants:
      - file: "kowal"
        base: true
        condition: null
        label: "Krasnoludzki kowal przy kuźni"
        prompt_extra: "podziemna kuźnia, żarzący się piec, krasnoludzki kowal przy kowadle, iskry, narzędzia kowalskie na ścianach, ciepłe pomarańczowe światło kontrastujące z chłodem podziemi"
    description: |
      Ciepło bijące od pieca kontrastuje z chłodem reszty podziemi. Przy
      kowadle stoi krasnoludzki kowal, pochłonięty pracą. Podnosi wzrok
      na twój widok. "Rzadko tu kto zachodzi. Pokaż no ten miecz."
    exits:
      zachód: czarodziejka
    items: []
    npcs:
      - id: kowal
        name: "Krasnoludzki Kowal"
        description: |
          Stary krasnoludzki kowal, ostatni ze swojego rodu w tych
          podziemiach. Zna się na broni lepiej niż ktokolwiek. Rozpozna
          magiczny metal na pierwszy rzut oka — ale bez magicznej ostrzałki
          nie naostrzy niczego porządnie.
        state: "czeka"
        scripted_solutions:
          - id: naostrzenie
            requires: {inventory_all: ["magiczna ostrzałka", "zardzewiały miecz"]}
            allow_talk: true
            action_hint: "gracz musi wyraźnie zaangażować kowala w sprawę miecza — dać/pokazać/wręczyć miecz, poprosić o naostrzenie, albo zapytać co z nim zrobić — mając przy tym magiczną ostrzałkę"
            trigger: "gracz daje, pokazuje, wręcza kowalowi zardzewiały miecz, prosi o jego naostrzenie, albo pyta co z nim zrobić"
            outcome: |
              Kowal bierze miecz, ogląda go pod światło, marszczy brwi.
              "Zardzewiały? Chyba żartujesz." Przykłada magiczną ostrzałkę
              do ostrza — iskry sypią się inaczej niż powinny, niebieskawo.
              Oczy kowala robią się wielkie. "To nie jest zwykłe żelazo...
              Ten miecz jest magiczny. Ktoś to dawno temu ukrył pod rdzą,
              specjalnie." Oddaje naostrzony, lśniący miecz. "Teraz jest
              gotowy na to, co przed tobą."
            flags: {miecz_naostrzony: true}
            inventory_remove: ["magiczna ostrzałka", "zardzewiały miecz"]
            inventory_add: ["magiczny miecz"]
          - id: brak_ostrzalki
            requires: {inventory_missing: "magiczna ostrzałka"}
            allow_talk: true
            trigger: "gracz daje, pokazuje, wręcza kowalowi zardzewiały miecz, prosi o jego naostrzenie, albo pyta co z nim zrobić"
            action_hint: "gracz musi wyraźnie zaangażować kowala w sprawę miecza — dać/pokazać/wręczyć miecz, poprosić o naostrzenie, albo zapytać co z nim zrobić"
            outcome: |
              Kowal kręci głową. "Zwykłym kamieniem tego nie naostrzę —
              ten miecz potrzebuje magicznej ostrzałki. Znajdziesz taką
              w starych ruinach fortu, o ile jeszcze tam jest."
            flags: {wie_o_ostrzalce: true}
        no_match_messages:
          - "Kowal wraca do swojej pracy, nie zwracając na ciebie uwagi."
          - "Kowal tylko mruczy coś pod nosem i stuka młotkiem."
        creative_solutions_hint: |
          Kowal naostrzy zardzewiały miecz TYLKO gdy gracz ma magiczną
          ostrzałkę. Bez niej odsyła do ruin fortu.
    atmosphere: "żar pieca, iskry, stukot młotka"

  oaza_beduinow:
    name: "Oaza Beduinów"
    image_variants:
      - file: "oaza_beduinow"
        base: true
        condition: null
        label: "Oaza pośrodku pustyni"
        prompt_extra: "zielona oaza pośrodku bezkresnej pustyni, palmy, mała sadzawka wody, namioty beduinów, stary mędrzec siedzący w cieniu palmy, kontrast zieleni z żółtym piaskiem"
    description: |
      Zielona plama pośrodku morza piasku — kilka palm, mała sadzawka,
      rozstawione namioty. W cieniu jednej z palm siedzi stary mędrzec,
      otoczony zwojami i mapami. Podnosi wzrok, gdy się zbliżasz.
    exits:
      południe: pustynia_wydmy
      północ: ruiny_fortu
      wschód: uschle_drzewo
      zachód: undead_warriors
    items: []
    npcs:
      - id: medrzec
        name: "Mędrzec Beduinów"
        description: |
          Stary mędrzec, który przemierzył pustynię więcej razy, niż pamięta.
          Ma pergamin z instrukcją przejścia burzy piaskowej, ale nie odda
          go za darmo — czeka, aż ktoś uratuje uschłe drzewo rosnące na
          wschodzie, które od lat powoli umiera. Mówi jak pustelnik z lasu —
          nie odpowiada wprost, tylko okrąża pytanie ze wszystkich stron,
          zanim do niego dotrze. Jego metafory krążą wokół dwóch rzeczy:
          czasu, który jest sypki jak piasek — nic nie trzyma kształtu,
          wszystko przesypuje się między palcami, wydmy zmieniają się z
          każdym powiewem wiatru — oraz wody, źródła wszelkiego istnienia —
          na pustyni cenniejszej niż złoto, tego, do czego każda historia
          w końcu wraca. Słyszał plotki o Czarodziejce, której imienia nikt
          nie zna, ale nic nie zdradza za darmo — to prawo pustyni, nie
          chciwość: każda kropla ma swoją cenę.
        state: "czeka"
        scripted_solutions:
          - id: nagroda_za_drzewo
            requires: {flag: drzewo_uratowane, value: true}
            allow_talk: true
            trigger: "gracz pyta mędrca o kompas, pergamin, drogę przez burzę lub pomoc"
            outcome: |
              Mędrzec uśmiecha się. "Uratowałeś drzewo — czuję to w powietrzu.
              Trzymaj więc, na co zasłużyłeś." Podaje stary pergamin.
              "Burza piaskowa słucha tylko jednej drogi: północ, południe,
              północ, zachód, wschód. Ani kroku inaczej."
            flags: {}
            inventory_add: ["pergamin z instrukcją"]
          - id: brak_nagrody
            requires: {flag: drzewo_uratowane}
            allow_talk: true
            trigger: "gracz pyta mędrca o kompas, pergamin, drogę przez burzę lub pomoc"
            outcome: |
              Mędrzec kręci głową. "Wiem, po co przyszedłeś, ale nic nie dam
              za darmo. Widzisz to uschłe drzewo na wschodzie? Umiera od lat.
              Uratuj je, a dostaniesz ode mnie to, czego szukasz."
            flags: {}
        creative_solutions_hint: |
          Mędrzec nie da pergaminu dopóki uschłe drzewo (na wschodzie) nie
          zostanie uratowane (flaga drzewo_uratowane) — to jedyna twarda
          zasada. Poza tym, w swobodnej rozmowie (pytania spoza triggerów
          powyżej) mów jego głosem: jak pustelnik z lasu, nie odpowiadaj
          wprost — okrąż pytanie metaforą, zanim dojdziesz do sedna. Dwa
          stałe motywy, do których zawsze wraca: CZAS jako piasek (ulotność,
          nietrwałość, wszystko przesypuje się i zmienia kształt jak wydmy)
          oraz WODA jako źródło wszelkiego istnienia (najcenniejsza rzecz
          na pustyni, symbol życia, prawdy i tego do czego wszystko wraca).
          Na pytania o Czarodziejkę reaguje wymijająco (wie że coś krąży,
          ale nic nie zdradza za darmo — zgodnie z jego charakterem "nic za
          darmo").
    atmosphere: "cień palm, plusk wody, chwila spokoju pośród żaru"

  ruiny_fortu:
    name: "Ruiny Fortu"
    image_variants:
      - file: "ruiny_fortu"
        base: true
        condition: null
        label: "Zrujnowany fort na pustyni"
        prompt_extra: "zrujnowany, na wpół zasypany piaskiem stary fort, połamane mury, ślady dawnej bitwy, porzucony oręż, złowieszcza, opuszczona atmosfera"
    description: |
      Zrujnowane mury starego fortu sterczą z piasku jak połamane zęby.
      Coś tu się wydarzyło dawno temu — i nie skończyło się dobrze.
      Na wschodzie, między ruinami, słychać coś poruszającego się w piasku.
    exits:
      południe: oaza_beduinow
      wschód: skorpion_z_fortu
    items:
      - id: ostrzalka
        name: "magiczna ostrzałka"
        hint: "coś błyszczącego wśród gruzu"
        description: "Niewielki, gładki kamień, chłodny w dotyku mimo żaru pustyni. Wyczuwasz w nim drzemiącą magię."
        takeable: true
        hidden_when: {flag: wie_o_ostrzalce}
      - id: zapasowy_miecz
        name: "zardzewiały miecz"
        hint: "stary miecz wbity w piasek między gruzami"
        description: "Stary, zardzewiały miecz — ktoś go tu kiedyś zostawił, albo zgubił w pośpiechu."
        takeable: true
        hidden_when: {inventory: "zardzewiały miecz"}
      - id: zapasowa_lopata
        name: "łopata"
        hint: "łopata oparta o połamany mur"
        description: "Solidna, choć nadgryziona rdzą łopata. Nadal się nada do kopania."
        takeable: true
        hidden_when: {inventory: "łopata"}
    npcs: []
    atmosphere: "opuszczenie, wiatr świszczący między ruinami, ślady dawnej walki"

  skorpion_z_fortu:
    name: "Przejście przez Ruiny"
    image_variants:
      - file: "skorpion_pokonany"
        condition: {flag: skorpion_pokonany, value: true}
        label: "Martwy skorpion, przejście wolne"
        prompt_extra: "skorpion leży nieruchomo na boku, martwy — ogon bezwładnie opuszczony, odnóża podkurczone, pancerz matowy bez połysku, reszta sceny bez zmian"
      - file: "skorpion"
        base: true
        condition: null
        label: "Olbrzymi skorpion blokuje przejście"
        prompt_extra: "olbrzymi pustynny skorpion pośród ruin, uniesiony jadowity ogon, agresywna poza, piasek i gruz dookoła, napięta atmosfera"
    description_variants:
      - condition: {flag: skorpion_pokonany, value: true}
        description: |
          Wąskie przejście między zwałami gruzu. Martwy skorpion leży na
          boku tam, gdzie go zostawiłeś. Droga na wschód stoi otworem.
      - condition: null
        description: |
          Wąskie przejście między zwałami gruzu. Na drodze, z uniesionym
          ogonem, stoi olbrzymi pustynny skorpion — najwyraźniej to jego
          terytorium, i nie zamierza go oddać bez walki.
    exits:
      zachód:
        target: ruiny_fortu
        entry_only: true
        entry_only_unless: {flag: skorpion_pokonany, value: true}
      południe:
        target: uschle_drzewo
        entry_only: true
        entry_only_unless: {flag: skorpion_pokonany, value: true}
      wschód:
        target: zasypana_studnia
        requires: {flag: skorpion_pokonany, value: true}
        blocked_message: "Skorpion zagradza drogę na wschód, ogon uniesiony do ataku."
    items: []
    npcs:
      - id: skorpion
        name: "Olbrzymi Skorpion"
        description: |
          Ogromny, pancerny skorpion pustynny. Zwierzę — nie rozmawia, nie
          da się przekupić ani przekonać słowami. Reaguje tylko na realne
          zagrożenie.
        state: "blokuje"
        unavailable_states:
          pokonany: "Martwy skorpion leży na boku, przejście na wschód stoi otworem."
        scripted_solutions:
          - id: walka_zardzewialym
            requires: {inventory: "zardzewiały miecz"}
            action_hint: "gracz musi wyraźnie zaatakować/użyć zardzewiałego miecza na skorpionie"
            trigger: "gracz atakuje skorpiona zardzewiałym mieczem"
            outcome: |
              Skorpion rzuca się do ataku, ale jesteś szybszy. Ostrze
              trafia w słaby punkt między płytami pancerza. Zwierzę
              zwija się i znieruchomiewa. Droga na wschód stoi otworem.
            flags: {skorpion_pokonany: true, skorpion_state: pokonany}
          - id: walka_mieczem_zbroja
            requires: {inventory: "miecz i zbroja"}
            action_hint: "gracz musi wyraźnie zaatakować/użyć miecza na skorpionie"
            trigger: "gracz atakuje skorpiona swoim mieczem"
            outcome: |
              Osłonięty zbroją, wytrzymujesz jedno uderzenie ogona i
              kontrujesz celnym cięciem w słaby punkt pancerza. Skorpion
              zwija się i znieruchomiewa. Droga na wschód stoi otworem.
            flags: {skorpion_pokonany: true, skorpion_state: pokonany}
        no_match_messages:
          - "Skorpion unosi ogon groźniej, ale nic więcej się nie dzieje."
          - "Zwierzę nie reaguje na cokolwiek innego niż realny atak."
        creative_solutions_hint: |
          To zwykłe zwierzę — nie rozmawia, nie da się przekupić. Trzeba go
          pokonać mieczem (zardzewiałym albo tym z ekwipunku wojownika).
    atmosphere: "napięcie, gorący piasek, cień zagrożenia"

  zasypana_studnia:
    name: "Zasypana Studnia"
    image_variants:
      - file: "zasypana_studnia"
        base: true
        condition: null
        label: "Studnia zasypana piaskiem"
        prompt_extra: "stara kamienna studnia na wpół zasypana piaskiem pustyni, popękany kamienny obrys, ślady dawnej świetności, samotne miejsce"
    description: |
      Stara kamienna studnia, dawno zasypana piaskiem. Ktoś, kto miałby
      czym kopać, mógłby jeszcze coś na jej dnie znaleźć.
    exits:
      zachód: skorpion_z_fortu
    items: []
    npcs:
      - id: studnia
        name: "Zasypana Studnia"
        is_object: true
        description: |
          Kamienna studnia po brzegi wypełniona piaskiem. WAŻNE: odkopanie
          wymaga łopaty — bez niej gracz nie da rady, piasek osypuje się
          z powrotem gołymi rękami.
        state: "zasypana"
        scripted_solutions:
          - id: kopanie
            requires: {inventory: "łopata"}
            action_hint: "gracz musi wyraźnie użyć łopaty do kopania/odkopywania studni"
            trigger: "gracz kopie, odkopuje studnię łopatą"
            outcome: |
              Kopiesz uparcie, piasek osypuje się warstwa po warstwie.
              W końcu łopata uderza o coś twardego — to stary, magiczny
              bukłak, wciąż szczelny mimo lat pod piaskiem. Wewnątrz
              pluska woda, choć bukłak wygląda na pusty w środku, jakby
              nie miał dna.
            flags: {studnia_wykopana: true}
            inventory_add: ["magiczny bukłak niekończącej się wody"]
          - id: bez_lopaty
            requires: {inventory_missing: "łopata"}
            action_hint: "gracz próbuje kopać gołymi rękami lub bez narzędzia"
            trigger: "gracz próbuje odkopać studnię bez łopaty"
            outcome: |
              Próbujesz kopać gołymi rękami, ale piasek osypuje się z
              powrotem szybciej niż zdążysz go odgarnąć. Potrzebujesz
              czegoś do kopania.
            flags: {}
        no_match_messages:
          - "Piasek w studni leży nieruszony."
          - "Nic się nie dzieje — studnia dalej jest zasypana."
        creative_solutions_hint: |
          Studnię da się odkopać TYLKO łopatą. Bez niej żadna kreatywność
          nie pomoże — piasek jest zbyt sypki.
    atmosphere: "cisza, żar, samotność zapomnianego miejsca"

  uschle_drzewo:
    name: "Uschłe Drzewo"
    image_variants:
      - file: "uschle_drzewo_uratowane"
        condition: {flag: drzewo_uratowane, value: true}
        label: "Ożywione drzewo"
        prompt_extra: "to samo drzewo, teraz pełne zielonych liści i magicznie świecącej kory, kontrast z suchym piaskiem dookoła, cudowna odnowa życia"
      - file: "uschle_drzewo"
        base: true
        condition: null
        label: "Uschłe, umierające drzewo"
        prompt_extra: "samotne, suche, umierające drzewo pośrodku pustyni, gałęzie bez liści, spękana kora, smutna, melancholijna atmosfera"
    description: |
      Samotne, uschłe drzewo pośrodku piasku. Jego gałęzie są suche i
      łamliwe, kora popękana z pragnienia. Mimo to czujesz w nim coś —
      jakby wciąż tliła się w nim resztka życia, czekająca na ratunek.
    exits:
      zachód: oaza_beduinow
      północ: skorpion_z_fortu
    items: []
    npcs:
      - id: drzewo
        name: "Uschłe Drzewo"
        is_object: true
        description: |
          Umierające, magiczne drzewo. WAŻNE: ożywa TYLKO gdy gracz świadomie
          da mu magiczny bukłak niekończącej się wody — samo posiadanie
          bukłaka w ekwipunku nic nie zmienia, trzeba go wyraźnie oddać.
        state: "usychające"
        unavailable_states:
          uratowane: "Drzewo stoi pełne życia, liście szumią choć nie ma wiatru. Jego kora świeci delikatnie magicznym blaskiem."
        scripted_solutions:
          - id: ratowanie
            requires: {inventory: "magiczny bukłak niekończącej się wody"}
            allow_talk: true
            action_hint: "gracz musi wyraźnie dać/wylać/podarować magiczny bukłak drzewu — samo posiadanie bukłaka nie wystarczy"
            trigger: "gracz daje, wylewa lub ofiarowuje magiczny bukłak drzewu"
            outcome: |
              Wylewasz wodę z bukłaka na spękane korzenie. Woda płynie i
              płynie, jakby bukłak nie miał dna — aż w końcu, opróżniony,
              osuwa się między korzenie i znika, wchłonięty przez drzewo.
              Drzewo drży, kora zaczyna pękać inaczej niż wcześniej —
              pojawiają się pod nią żywe, zielone włókna. W ciągu chwil
              drzewo odżywa całkowicie, pokrywa się liśćmi, a jego kora
              zaczyna delikatnie świecić. Odłamujesz kawałek tej magicznej
              kory, który drzewo jakby samo ci ofiarowuje.
            flags: {drzewo_uratowane: true, drzewo_state: uratowane}
            inventory_add: ["magiczna kora"]
            inventory_remove: ["magiczny bukłak niekończącej się wody"]
        no_match_messages:
          - "Drzewo stoi nieruchomo, suche i milczące."
          - "Nic się nie dzieje — drzewo dalej usycha."
        creative_solutions_hint: |
          Drzewo ożywa TYLKO gdy dostanie magiczny bukłak niekończącej się
          wody (ze studni). Nic innego nie pomoże.
    atmosphere: "melancholia, susza, cień nadziei"

  undead_warriors:
    name: "Cmentarzysko Wojowników"
    image_variants:
      - file: "undead_pokonani"
        condition: {flag: undead_pokonani, value: true}
        label: "Kości nieruchomo na piasku"
        prompt_extra: "szkielety leżą nieruchomo, rozsypane na piasku, kości bezładnie porozrzucane, żadnego stojącego wojownika, reszta sceny bez zmian"
      - file: "undead_warriors"
        base: true
        condition: null
        label: "Nieumarli wojownicy blokują drogę"
        prompt_extra: "pustynne cmentarzysko z wystającymi z piasku kośćmi i zbroją, grupa nieumarłych szkieletów-wojowników blokujących przejście, złowieszcze, mroczne, magiczne pustynne słońce"
    description_variants:
      - condition: {flag: undead_pokonani, value: true}
        description: |
          Piasek tu jest usiany kośćmi i szczątkami starej zbroi — teraz
          już tylko martwym żelastwem. Cokolwiek ożywiało te szkielety,
          zniknęło bez śladu. Droga na północ stoi otworem.
      - condition: null
        description: |
          Piasek tu jest usiany kośćmi i szczątkami starej zbroi. Z ziemi
          powoli podnoszą się nieumarli wojownicy — szkielety w zbutwiałych
          pancerzach, strzegące przejścia na północ od niepamiętnych czasów.
    exits:
      wschód: oaza_beduinow
      północ:
        target: wrak_karawany
        requires: {flag: undead_pokonani, value: true}
        blocked_message: "Nieumarli wojownicy zagradzają drogę na północ, kościane dłonie zaciśnięte na rdzewiejącej broni."
    items: []
    npcs:
      - id: undead_warriors
        name: "Nieumarli Wojownicy"
        description: |
          Grupa szkieletów-wojowników, ożywionych jakimś starym przekleństwem.
          Nie rozmawiają, nie dają się przekupić — to nieumarli, obce
          zwykłej magii i słowom. Boją się tylko jednej rzeczy: prawdziwego
          życia.
        state: "blokują"
        unavailable_states:
          pokonani: "Kości leżą nieruchomo na piasku — cokolwiek je ożywiało, zniknęło. Droga na północ stoi otworem."
        scripted_solutions:
          - id: magiczna_kora
            requires: {inventory: "magiczna kora"}
            allow_talk: true
            action_hint: "gracz musi wyraźnie użyć/pokazać/rzucić magiczną korę na nieumarłych — samo posiadanie kory nie wystarczy"
            trigger: "gracz używa, rzuca lub pokazuje magiczną korę nieumarłym wojownikom"
            outcome: |
              Magiczna kora w twojej dłoni rozjaśnia się, promieniując
              czymś, czego te kości nie potrafią znieść — czystym, żywym
              życiem pustyni. Szkielety cofają się z bezgłośnym jękiem,
              rozpadając się jeden po drugim, aż zapada cisza. Kości
              opadają nieruchomo na piasek.
            flags: {undead_pokonani: true}
            inventory_remove: ["magiczna kora"]
        no_match_messages:
          - "Szkielety robią krok naprzód, grożąc bronią, ale nic więcej się nie dzieje."
          - "Nieumarli nie reagują na nic poza tym, czego naprawdę się boją."
        creative_solutions_hint: |
          Nieumarłych da się pokonać TYLKO magiczną korą z ożywionego
          drzewa — nic innego (walka, słowa, przedmioty) nie działa.
    atmosphere: "złowieszcza cisza, szczęk starych kości, chłód mimo słońca"

  wrak_karawany:
    name: "Wrak Karawany"
    image_variants:
      - file: "wrak_karawany"
        base: true
        condition: null
        label: "Szczątki dawnej karawany"
        prompt_extra: "szczątki starej karawany na pustyni, połamane wozy, kości wielbłądów wystające z piasku, porzucone bagaże, ślady dawnej tragedii, złociste światło zachodzącego słońca"
    description: |
      Połamane wozy i kości wielbłądów wystają z piasku — szczątki
      karawany, która nigdy nie dotarła do celu. Wśród porzuconych
      bagaży wciąż można coś znaleźć.
    exits:
      południe: undead_warriors
    items:
      - id: kompas
        name: "kompas"
        hint: "coś metalowego błyszczącego wśród szczątków"
        description: "Stary mosiężny kompas. Jego igła nie wskazuje północy — kręci się niespokojnie, jakby wyczuwała coś w burzy piaskowej."
        takeable: true
    npcs: []
    atmosphere: "cisza po tragedii, wiatr poruszający porzuconym płótnem"

  # ===== POZIOM 1: MIASTO =====

  pokoj_karczmy:
    name: "Pokój na górze karczmy"
    image_variants:
      - file: "pokoj_karczmy_bez_klucza"
        condition: {inventory_contains: "klucz do pokoju"}
        label: "Pokój — klucz wzięty"
        prompt_extra: "mały, skromny pokój na górze karczmy, łóżko z siennikiem, pusty stół bez klucza, stara szafa pod ścianą, okno wychodzące na miasto, szare ranne światło"
      - file: "pokoj_karczmy"
        base: true
        condition: null
        label: "Mały pokój w karczmie (z kluczem na stole)"
        prompt_extra: "mały, skromny pokój na górze karczmy, łóżko z siennikiem, stół z kluczem, stara szafa pod ścianą, okno wychodzące na miasto, szare ranne światło"
    description: |
      Mały, duszny pokój. Łóżko z siennikiem, stół, stara szafa pod ścianą.
      Na stole leży klucz — pewnie od drzwi wyjściowych. Drzwi na południe są zamknięte.
      Za oknem szare niebo nad Kamienną Górą.
    exits:
      wyjście:
        target: karczma
        aliases: ["południe"]
        requires: {flag: drzwi_pokoj_state, value: otwarte, inventory_all: ["miecz i zbroja", "mieszek ze złotem"]}
        hidden: false
        blocked_message: "Drzwi są zamknięte na klucz. Musisz je najpierw otworzyć."
        blocked_message_items: "Nie zostawię tu mojej zbroi i pieniędzy bez opieki — tylko gdzie ja to położyłem? Nie mam pojęcia, muszę poszukać."
    items:
      - id: klucz_pokoj
        name: "klucz do pokoju"
        hint: "żelazny klucz leżący na stole"
        description: "Zwykły żelazny klucz. Do drzwi wyjściowych z pokoju."
        takeable: true
      - id: szafa
        name: "stara szafa"
        hint: "stara drewniana szafa pod ścianą"
        description: "Otwierasz szafę. W środku twój dobytek z ostatniej wyprawy — weź co potrzebujesz."
        takeable: false
        examine_sets_flag: {szafa_otwarta: true}
        set_on: examine
      - id: miecz_i_zbroja
        name: "miecz i zbroja"
        hint: "twoja broń i zbroja w szafie"
        description: "Twój stary komplet uzbrojenia z ostatniej wyprawy — dobrze wyważony, niezawodny."
        takeable: true
        hidden_when: {flag: szafa_otwarta, value: null}
      - id: mieszek_m
        name: "mieszek ze złotem"
        hint: "mieszek na dnie szafy"
        description: "Twoje oszczędności — kilka złotych monet. Mało, ale zawsze coś."
        takeable: true
        hidden_when: {flag: szafa_otwarta, value: null}
    npcs:
      - id: drzwi_pokoj
        name: "zamknięte drzwi"
        is_object: true
        no_match_message: "Szarpiesz za klamkę, ale drzwi są solidnie zamknięte na klucz. Musisz wyraźnie użyć klucza, żeby je otworzyć."
        description: |
          Solidne drewniane drzwi z żelaznym zamkiem. Otwierają się kluczem.
          Nie próbuj ich wyważać — karczmarz ma cię na oku.
        state: "zamknięte"
        creative_solutions_hint: |
          To są nieożywione drzwi — nie rozmawiają, nie odpowiadają na pytania, nie mają osobowości.
          Jedyne możliwe działanie to otwarcie kluczem. Na wszystkie inne próby odpowiedz krótko
          że to zwykłe drewniane drzwi i nic więcej.
        scripted_solutions:
          - id: otworz_kluczem
            requires: {inventory: "klucz do pokoju"}
            allow_talk: true
            action_hint: "gracz musi wyraźnie wspomnieć użycie klucza ('kluczem', 'wkładam klucz do zamka', 'przekręcam klucz') — samo 'otwieram drzwi' albo 'otwieram zamek' bez wspomnienia klucza NIE wystarczy, nawet jeśli klucz jest w ekwipunku"
            trigger: "gracz używa klucza na drzwiach lub otwiera drzwi kluczem"
            outcome: |
              Wkładasz klucz do zamka i przekręcasz. Drzwi otwierają się z cichym skrzypnięciem.
              Możesz wyjść.
            flags: {drzwi_pokoj_state: otwarte}
    atmosphere: "duszny poranek, smród taniego piwa i słomy, głowa boli po wczorajszym"

  karczma:
    name: "Karczma Pod Złotym Dzbanem"
    image_variants:
      - file: "karczma"
        condition: null
        label: "Wnętrze karczmy"
        prompt_extra: "wnętrze średniowiecznej karczmy, grube drewniane stoły, kilku gości, za ladą gruby karczmarz wyciera kufle, niskie belkowane stropy, poranne szare światło przez małe okna"
    description: |
      Na dole karczmy gwar porannych gości. Za długą ladą stoi karczmarz Bolesław —
      gruby, rumiany, wyciera kufle ścierką. Przy stolikach kilku woźniców i kupców.
      Na południe wyjście na ulicę, na wschód boczna uliczka prowadzi w stronę bramy miejskiej.
    exits:
      wejście: pokoj_karczmy
      południe: ulica
      wschód: brama_miasta
    items: []
    npcs:
      - id: karczmarz
        name: "Karczmarz Bolesław"
        description: |
          Gruby, rumiany mężczyzna w fartuchu. Wszystko widzi, ale mówi tylko tyle ile musi.
          Zna każdego w mieście i każdą plotkę. Jest ostrożny — wie że ściany mają uszy.
          Pyta o karawanę? Mówi mało, ale przy okazji wspomina o młodości królowej.
          Kiedy opowie co wie o królowej, ustaw flagę pytanie_karczma.
          NIGDY nie mów wprost o siepaczy ani o niebezpieczeństwie pytań.
        state: "za_ladą"
        scripted_solutions:
          - id: historia_karczma
            allow_talk: true
            auto_reveal: true
            trigger: "gracz pyta o karawanę królewską, o zaginiony żołd, albo o królową"
            outcome: |
              O karawanie: przejeżdżali zeszłej nocy, bez zatrzymania — nikt nie wiedział co wiozą.
              Potem, w zaufaniu, dodaje jeszcze o Królowej: jej ojciec był okrutny, dworska szlachta
              się z niej śmiała, wykuła z tego serce zimne jak stal.
              Mówi krótko i wraca do roboty. Więcej nie powie.
            flags: {pytanie_karczma: true}
        creative_solutions_hint: |
          Karczmarz wie dużo ale mówi mało. Można go przekupić, zastraszać nie ma sensu.
          Jeśli gracz zapyta wprost i szczerze — powie co wie.
    crowd: true
    crowd_reaction_hint: "poranni goście karczmy — woźnice i kupcy zajęci własnym śniadaniem, nie zwracają na obcego uwagi"
    atmosphere: "gwar, smród piwa i dymu, ciepło po nocnym mrozie"

  ulica:
    name: "Główna Ulica Kamiennej Góry"
    image_variants:
      - file: "ulica_miasta"
        condition: null
        label: "Główna ulica"
        prompt_extra: "główna ulica średniowiecznego miasta, kamienne domy, brukowana droga, kupcy i przechodnie, szare niebo, w tle wieża ratusza na północy i targ na południu"
    description: |
      Brukowana ulica w centrum Kamiennej Góry. Przechodnie spieszą się w porannych
      sprawach. Na północy karczma, na wschodzie widać wejście do ratusza,
      na południu słychać gwar targowiska.
    exits:
      północ: karczma
      wschód: ratusz
      południe: targowisko
    items: []
    npcs: []
    crowd: true
    atmosphere: "ruch poranny, bruk mokry od nocnego deszczu, zapach piekarni gdzieś w pobliżu"

  ratusz:
    name: "Ratusz Miejski"
    image_variants:
      - file: "ratusz"
        condition: null
        label: "Hol ratusza"
        prompt_extra: "wnętrze średniowiecznego ratusza, kamienne ściany, nerwowy urzędnik przy biurku zawalonym dokumentami, herb miasta na ścianie, małe okna"
    description: |
      Wysoki hol z kamiennymi ścianami. Przy biurku zawalonym dokumentami siedzi
      urzędnik Feliks — chudy, nerwowy, ciągle coś zapisuje.
      Wyjście na zachód na ulicę, na północ brama do miasta.
    exits:
      zachód: ulica
      północ: brama_miasta
    items: []
    npcs:
      - id: urzednik
        name: "Urzędnik Feliks"
        description: |
          Chudy, nerwowy urzędnik w czarnym kaftanie. Cały czas coś pisze.
          Boi się własnego cienia — wyraźnie się stresuje gdy ktoś pyta o sprawy królewskie.
          Pyta o karawanę? Zaprzecza, że cokolwiek wie, ale niechcący wspomina o najeźdźcach
          i o tym jak Królowa doszła do władzy.
          Kiedy opowie co wie o królowej, ustaw flagę pytanie_ratusz.
        state: "przy_biurku"
        scripted_solutions:
          - id: historia_ratusz
            allow_talk: true
            auto_reveal: true
            trigger: "gracz pyta o karawanę królewską, o zaginiony żołd, o królową lub o sprawy królewskie"
            outcome: |
              O karawanie: zaprzecza że cokolwiek wie, to sprawy królewskie poza jego kompetencją.
              Potem, mimo woli, jakby sam siebie zaskoczył, dodaje jeszcze o Królowej:
              dziesięć lat temu najeźdźcy z północy, wojska klęskły, stary król uciekł —
              miała dwadzieścia lat, zebrała resztki wojska, odparła najazd sama,
              lud dał jej koronę. Wraca do dokumentów, zamyka temat.
            flags: {pytanie_ratusz: true}
        creative_solutions_hint: |
          Urzędnik jest tchórzliwy ale uczciwy. Zastraszanie nie działa — jest już wystraszony.
          Szczere pytanie w cztery oczy to najlepsze podejście.
    atmosphere: "zimny kamień, skrobanie pióra, zapach wosku i starych dokumentów"

  targowisko:
    name: "Targowisko"
    image_variants:
      - file: "targowisko"
        condition: null
        label: "Targowisko"
        prompt_extra: "zatłoczone średniowieczne targowisko, stragany z warzywami i towarami, hałas, tłum, przekupka za stoiskiem z ziołami, szare niebo"
    description: |
      Hałaśliwe targowisko pełne straganów. Woń warzyw, skóry i dymu.
      Między kramami przeciska się tłum. Przy straganie z ziołami stoi
      przekupka Jadwiga — stara, chuda kobieta o bystry oczach.
      Na północ ulica.
    exits:
      północ: ulica
    items: []
    npcs:
      - id: przekupka
        name: "Przekupka Jadwiga"
        description: |
          Stara, chuda kobieta z ostrymi oczami. Zna wszystkie plotki miasta.
          Mówi dużo ale nagle się urywa gdy dotkniesz drażliwego tematu.
          Pyta o karawanę? Wspomni coś o nocnych transportach, ale przy okazji
          opowie o buncie chłopskim po którym królowa się zmieniła.
          Kiedy opowie co wie o królowej, ustaw flagę pytanie_targowisko.
        state: "za_stoiskiem"
        scripted_solutions:
          - id: historia_targowisko
            allow_talk: true
            auto_reveal: true
            trigger: "gracz pyta o karawanę królewską, o zaginiony żołd lub o królową"
            outcome: |
              O karawanie: jeżdżą nocami, coś wiozą czego nie chcą pokazywać — tyle wie.
              Potem, z własnej inicjatywy, nagle, jakby długo chciała to powiedzieć, dodaje jeszcze
              o Królowej: trzy lata po tym jak uratowała kraj,
              chłopi się zbuntowali — podatki, głód. Rozbiła ich doszczętnie,
              powiedziała że czarną niewdzięcznością się odwdzięczyli.
              Urywa, cofa się — mówi że ma dzieci i więcej nie pyta.
            flags: {pytanie_targowisko: true}
        creative_solutions_hint: |
          Jadwiga boi się ale jest gadatliwa. Można ją zachęcić drobnym zakupem
          lub po prostu słuchając uważnie. Zastraszanie zamknie jej usta.
    crowd: true
    crowd_reaction_hint: "gwarny tłum kupców i klientów, nikt nie ma czasu na obcego"
    atmosphere: "hałas, tłum, woń targowiska, szara codzienna bieda"

  brama_miasta:
    name: "Brama Miejska"
    image_variants:
      - file: "brama_miasta"
        condition: null
        label: "Brama miejska"
        prompt_extra: "masywna kamienna brama średniowiecznego miasta, dwóch strażników w zbrojach z herbem królowej, portcullis, widok na drogę wyjeżdżającą z miasta"
    description: |
      Masywna kamienna brama z opuszczoną kratą. Dwóch strażników w zbrojach
      z herbem królowej pilnuje wejścia. Patrzą na ciebie bez wyrazu.
      Na południe ratusz i miasto, na zachód boczna uliczka prowadzi do karczmy.
    exits:
      południe: ratusz
      zachód: karczma
    items: []
    npcs:
      - id: straznik_bramy
        name: "Strażnik Bramy"
        description: |
          Wysokiej postury strażnik w ciężkiej zbroi z herbem królowej.
          Mówi krótko, patrzy uważnie. Wyraźnie szkolony żeby nic nie mówić.
          Pyta o karawanę? Odetnie się ostro. Ale coś jednak powie o obecnych rządach —
          jakby mimo woli.
          Kiedy powie co wie, ustaw flagę pytanie_brama.
          WAŻNE: strażnik jest lojalny wobec królowej — nie mówi źle wprost,
          ale między słowami słychać strach.
        state: "na_posterunku"
        scripted_solutions:
          - id: historia_brama
            allow_talk: true
            auto_reveal: true
            trigger: "gracz pyta o karawanę królewską, o zaginiony żołd, o królową lub o wyjazd z miasta"
            outcome: |
              O karawanie i wyjściu z miasta: odpowiada twardo, to tajne sprawy królewskie —
              za dużo ludzi pyta o nie swoje sprawy i znikają.
              Potem, jakby do siebie, odwrócony, dodaje jeszcze o Królowej: podatki co rok wyższe,
              wioski które nie płacą zostają puste ściany,
              kto coś powie... urywa. Odsyła gracza, kończy rozmowę.
            flags: {pytanie_brama: true}
        creative_solutions_hint: |
          Strażnik jest lojalny ale ma sumienie. Przekupstwo nie wchodzi w grę.
          Bezpośrednie pytanie przyniesie krótką odpowiedź — ale wystarczającą.
    atmosphere: "zimny wiatr, szczęk żelaza, napięcie — to ostatnia granica między miastem a światem"

  transport_wiezniarski:
    name: "Wóz Więzienny"
    image_variants:
      - file: "transport_wiezniarski"
        condition: null
        label: "Wóz więzienny w lesie"
        prompt_extra: "drewniany wóz więzienny jadący przez ciemny las, kraty, ręce związane liną, przez szpary widać drzewa i zmierzch, woźnica z przodu"
    description: |
      Leżysz skrępowany na dnie drewnianego wozu z kratami. Przez szczeliny
      widać ciemny las po obu stronach drogi. Wóz skrzypi i podskakuje na korzeniach.
      Twój ekwipunek gdzieś zniknął. Ręce masz związane — ale lina nie jest zbyt mocna.
      Słyszysz jak woźnica nuci pod nosem. Nie zwraca na ciebie uwagi.
    exits: {}
    items:
      - id: lina_wiezniarska
        name: "lina na rękach"
        hint: "lina wiążąca twoje ręce"
        description: "Prosta konopna lina. Supły są niedbałe — ktoś się spieszył. Przy odrobinie wysiłku można ją rozwiązać lub przepiłować o kant kraty."
        takeable: false
        examine_sets_flag: {lina_zbadana: true}
        set_on: examine
      - id: krata_wozu
        name: "krata wozu"
        hint: "drewniana krata boczna wozu"
        description: "Stare drewno, spróchniałe w rogach. Mocne uderzenie i krata puści — ale hałas obudzi woźnicę."
        takeable: false
        examine_sets_flag: {krata_zbadana: true}
        set_on: examine
    npcs:
      - id: ucieczka_woz
        name: "Okazja do ucieczki"
        description: |
          Wóz zwalnia na ostrym zakręcie w lesie. Krata jest spróchniała.
          To jedyna szansa — teraz albo nigdy.
          Gdy gracz podejmie próbę ucieczki przez kratę lub rozwiąże linę i wyskoczy,
          opisz dynamiczną ucieczkę i zakończ lokację.
          Gracz ląduje w lesie — zaczyna się właściwa przygoda.
        state: "w_drodze"
        scripted_solutions:
          - id: ucieczka
            trigger: "gracz próbuje uciec — wyważyć kratę, rozwiązać linę, wyskoczyć z wozu, uciec"
            outcome: |
              Szarpiesz linę o ostry kant kraty. Konopie puszczają po chwili.
              Wolne ręce. Czekasz na zakręt — wóz zwalnia. Teraz.
              Kopiesz spróchniałą kratę z całej siły. Wylatuje z hukiem.
              Woźnica krzyczy, ale już lecisz w ciemność lasu.
              Lądując między korzeniami, słyszysz jak wóz zatrzymuje się daleko za tobą.
              Jesteś wolny. Bez ekwipunku, bez broni. Sam w lesie przed zamkiem Królowej.
            flags: {uciekl_z_transportu: true, transport_opuszczony: true}
            move_to: las
        creative_solutions_hint: |
          Każda próba ucieczki powinna się udać — to punkt fabularny, nie wyzwanie.
          Gracz MA uciec. Opisz to dynamicznie.
    atmosphere: "skrzyp drewna, zapach lasu, strach i determinacja"
