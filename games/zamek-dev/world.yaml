  lesny_dziad:
    name: "Most Nad Wąwozem"
    image_variants:
      - file: "lesny_dziad"
        base: true
        condition: null
        label: "Stary dziad blokuje przejście"
        prompt_extra: "wąski drewniany most nad leśnym wąwozem, na środku stoi zgarbiony, stary dziad z laską, zagradzający przejście, gęsty las po obu stronach"
    description: |
      Wąski, drewniany most nad wąwozem. Na środku stoi zgarbiony, stary
      dziad z laską. Patrzy na ciebie podejrzliwie. "Nikt tędy nie przejdzie,
      chyba że odpowie mi na wszystkie sześć zagadek. Albo zna
      słowo, którego dawno nie słyszałem..." — chichocze, po czym recytuje:

      1. "Chodzę za tobą krok w krok, nigdy nie mówię, a zawsze jestem blisko.
         Znikam, gdy słońce zachodzi. Co jestem?"
      2. "Powtarzam każde twoje słowo, ale nigdy pierwsze nie wypowiadam.
         Mieszkam w wąwozach i pustych jaskiniach."
      3. "Płynę bez nóg, szumię bez ust, zawsze w dół, nigdy pod górę."
      4. "W dzień śpię, w nocy poluję. Widzę w ciemności lepiej niż ty w słońcu."
      5. "Rosnę po deszczu, jednej nocy, bez nasion i bez kwiatów. Niektórzy
         mnie jedzą, inni się mnie boją."
      6. "Zmieniam twarz co noc — raz pełna, raz wcale mnie nie widać. Świecę
         cudzym światłem."

      "Odpowiadając, powiedz wprost której zagadki to dotyczy — na przykład
      'odpowiedź na zagadkę trzecią to wiatr'. Samo rzucone słowo bez
      wskazania zagadki mnie nie przekona." — dodaje, opierając się o laskę.
    exits:
      południe: kobold
      północ:
        target: polana_ivana
        requires: {flag: dziad_przepuscil, value: true}
        blocked_message: "Stary dziad zagradza drogę laską. \"Najpierw zagadki, albo hasło.\""
    items: []
    npcs:
      - id: dziad
        name: "Leśny Dziad"
        description: |
          Zgarbiony, stary dziad z laską, zagradza most. Uwielbia zadawać
          zagadki i nie przepuści nikogo kto ich nie rozwiąże (wszystkie 6 z 6).
          Zna też stare hasło strażników bramy zamkowej — jeśli ktoś je zna,
          przepuści z szacunku, bez zagadek. NIGDY nie zdradzaj z własnej
          inicjatywy że był kiedyś strażnikiem bramy — to wychodzi na jaw
          TYLKO gdy gracz go przepuści i zapyta o niego samego.
        state: "blokuje"
        unavailable_states:
          przepuscil: "Dziad odsunął się już wcześniej — most stoi otworem."
        scripted_solutions:
          - id: haslo
            exact_sequence: ["bum", "bara", "dum"]
            action_hint: "gracz musi WYPOWIEDZIEĆ SŁOWNIE dokładnie hasło 'Bum bara dum' — nic innego nie zadziała tą drogą"
            trigger: "gracz wypowiada dokładnie hasło 'Bum bara dum'"
            outcome: |
              Dziad zamiera, oczy mu się rozszerzają. "Skąd... skąd ty to znasz?"
              Po chwili milczenia odsuwa się z szacunkiem. "Przechodź. Dawno
              nikt tego nie powiedział. Ale wiedz — moje zagadki to nic. Kto nie
              zna kolorów we właściwej kolejności, ten i tak nic dalej nie zobaczy."
            flags: {dziad_przepuscil: true}
          - id: historia_dziada
            requires: {flag: dziad_przepuscil, value: true}
            allow_talk: true
            trigger: "gracz pyta dziada kim jest, o jego przeszłość, dlaczego zna hasło"
            outcome: |
              Dziad wzdycha. "Byłem strażnikiem bramy zamkowej, dawno temu.
              Zanim... zanim wszystko się zmieniło. Odszedłem w las i już nie
              wróciłem." Milknie, patrząc gdzieś w dal.
            flags: {}
            inventory_add: ["historia dziada"]
          - id: zagadka_cien
            requires: {flag: zagadka_cien}
            action_hint: "gracz musi jawnie wskazać, że odpowiada na zagadkę o czymś co chodzi krok w krok i znika o zachodzie słońca (np. numerem, powtórzeniem fragmentu treści albo słowami 'ta o cieniu/sylwetce') ORAZ podać odpowiedź 'cień' — samo rzucone słowo 'cień' bez odniesienia do KTÓREJ zagadki dotyczy NIE wystarczy"
            trigger: "gracz odpowiada 'cień' na zagadkę dziada"
            outcome: |
              Dziad kiwa głową z uznaniem. "Cień. Dobrze, dobrze. Znasz się na
              rzeczy."
            flags: {zagadka_cien: true}
          - id: zagadka_echo
            requires: {flag: zagadka_echo}
            action_hint: "gracz musi jawnie wskazać, że odpowiada na zagadkę o powtarzaniu słów w wąwozach i jaskiniach (numer, fragment treści albo 'ta o echu') ORAZ podać odpowiedź 'echo' — samo rzucone słowo 'echo' bez odniesienia do KTÓREJ zagadki dotyczy NIE wystarczy"
            trigger: "gracz odpowiada 'echo' na zagadkę dziada"
            outcome: |
              Dziad uśmiecha się szeroko. "Echo. Trafione."
            flags: {zagadka_echo: true}
          - id: zagadka_rzeka
            requires: {flag: zagadka_rzeka}
            action_hint: "gracz musi jawnie wskazać, że odpowiada na zagadkę o płynięciu bez nóg zawsze w dół (numer, fragment treści albo 'ta o rzece') ORAZ podać odpowiedź 'rzeka' — samo rzucone słowo 'rzeka' bez odniesienia do KTÓREJ zagadki dotyczy NIE wystarczy"
            trigger: "gracz odpowiada 'rzeka' na zagadkę dziada"
            outcome: |
              Dziad kiwa głową. "Rzeka. Zgadza się."
            flags: {zagadka_rzeka: true}
          - id: zagadka_sowa
            requires: {flag: zagadka_sowa}
            action_hint: "gracz musi jawnie wskazać, że odpowiada na zagadkę o spaniu w dzień i polowaniu w nocy (numer, fragment treści albo 'ta o sowie') ORAZ podać odpowiedź 'sowa' — samo rzucone słowo 'sowa' bez odniesienia do KTÓREJ zagadki dotyczy NIE wystarczy"
            trigger: "gracz odpowiada 'sowa' na zagadkę dziada"
            outcome: |
              Dziad mruga porozumiewawczo. "Sowa. Dobrze mówisz."
            flags: {zagadka_sowa: true}
          - id: zagadka_grzyb
            requires: {flag: zagadka_grzyb}
            action_hint: "gracz musi jawnie wskazać, że odpowiada na zagadkę o rośnięciu po deszczu bez nasion i kwiatów (numer, fragment treści albo 'ta o grzybie') ORAZ podać odpowiedź 'grzyb' — samo rzucone słowo 'grzyb' bez odniesienia do KTÓREJ zagadki dotyczy NIE wystarczy"
            trigger: "gracz odpowiada 'grzyb' na zagadkę dziada"
            outcome: |
              Dziad chichocze. "Grzyb. Właśnie tak."
            flags: {zagadka_grzyb: true}
          - id: zagadka_ksiezyc
            requires: {flag: zagadka_ksiezyc}
            action_hint: "gracz musi jawnie wskazać, że odpowiada na zagadkę o zmienianiu twarzy co noc i świeceniu cudzym światłem (numer, fragment treści albo 'ta o księżycu') ORAZ podać odpowiedź 'księżyc' — samo rzucone słowo 'księżyc' bez odniesienia do KTÓREJ zagadki dotyczy NIE wystarczy"
            trigger: "gracz odpowiada 'księżyc' na zagadkę dziada"
            outcome: |
              Dziad kiwa głową powoli. "Księżyc. Tak, tak."
            flags: {zagadka_ksiezyc: true}
        no_match_messages:
          - "Dziad kręci głową. \"Nie zgadłeś — albo nie powiedziałeś, której zagadki to dotyczy. Spróbuj jeszcze raz.\""
          - "Dziad tylko mruczy pod nosem i nie rusza się z miejsca. \"Powiedz wprost, o którą zagadkę chodzi.\""
          - "\"Nie, nie, nie o to chodzi — albo nie wiem do czego się odnosisz\" — dziad postukuje laską, wciąż blokując drogę."
        creative_solutions_hint: |
          Gracz musi trafić wszystkie 6 zagadek (kolejność dowolna) ALBO wypowiedzieć
          hasło "Bum bara dum" (ten sam sekret co brama zamku — easter egg,
          nigdzie nie podpowiedziany). Odpowiedzi: cień, echo, rzeka, sowa,
          grzyb, księżyc. Gracz MUSI wskazać do której zagadki się odnosi
          (numerem, fragmentem treści albo jednoznacznym opisem) — samo
          rzucone słowo-odpowiedź bez tego odniesienia nie liczy się jako
          trafienie. Akceptuj jasne synonimy/opisowe odpowiedzi wskazujące
          na tę samą rzecz, ale nie zupełnie inne słowa.
    atmosphere: "skrzypienie drewnianego mostu, szum wąwozu w dole"

  driada:
    name: "Gąszcz Centaura"
    image_variants:
      - file: "centaur_wywabiony"
        condition: {flag: centaur_wywabiony, value: true}
        label: "Centaur wywabiony"
        prompt_extra: "centaur stojący spokojnie na leśnej polance, trzyma starą księgę, przyjazna poza, gęste krzaki w tle"
      - file: "centaur"
        base: true
        condition: null
        label: "Centaur ukryty w gąszczu"
        prompt_extra: "gęsty leśny gąszcz, między krzakami widać cień i zarys centaura, który się chowa, nie chce wyjść"
    description: |
      Gęsty gąszcz. Coś dużego porusza się między krzakami — zarys końskiego
      grzbietu i ludzkiego torsu. Centaur. Chowa się i nie chce wyjść.
    exits:
      zachód: las01
      północ: las02
    items: []
    npcs:
      - id: centaur
        name: "Centaur Chiron"
        description: |
          Płochliwy centaur, chowa się w gąszczu. Ufa tylko swojej przyjaciółce,
          driadzie Ariannie. Uwielbia słodycze. Nie wyjdzie dla samego jedzenia —
          trzeba też wspomnieć imię Arianny, żeby uwierzył że gracz jest w porządku.
        state: "ukryty"
        unavailable_states:
          wywabiony: "Centaur stoi spokojnie opodal, przeżuwając resztki cukru."
        scripted_solutions:
          - id: wspomina_ariannę
            allow_talk: true
            action_hint: "gracz musi wyraźnie wspomnieć imię Arianny centaurowi — samo pytanie ogólne albo próba zbliżenia się bez tego nie wystarczy"
            trigger: "gracz wspomina imię Arianny centaurowi, mówi że go przysyła lub że ją zna"
            outcome: |
              Na dźwięk imienia Arianny centaur nieco się uspokaja, choć wciąż nie
              wychodzi z gąszczu. "Skoro znasz Ariannę... może nie jesteś taki zły."
              Waha się przez chwilę. "Uwielbiam słodycze. Może gdybyś miał coś
              słodkiego, wyszedłbym stąd."
            flags: {centaur_ufa: true}
          - id: wywabienie
            requires: {inventory: "kostki cukru", flags_any_false: {centaur_ufa: true}}
            allow_talk: true
            action_hint: "gracz musi wyraźnie zaoferować/rzucić/dać kostki cukru (słownie lub fizycznie) ORAZ wspomnieć imię Arianny — samo jedno z tych dwóch nie wystarczy"
            trigger: "gracz oferuje, daje, rzuca lub deklaruje że ma dla centaura kostki cukru i wspomina imię Arianny"
            outcome: |
              Na dźwięk imienia Arianny centaur unosi głowę. Widzi cukier w twojej
              dłoni i powoli wychodzi z gąszczu. "Skoro znasz Ariannę..." — mruczy,
              biorąc cukier. Sięga za pazuchę i podaje ci starą, oprawioną w skórę
              księgę. "To księga run. Będziesz jej potrzebował. Zaklęta — sama
              zapisuje historie tych, których spotkasz w tym lesie, więc niczego
              nie zapomnisz. Przypomni sobie nawet to, czego już się dowiedziałeś,
              zanim ją dostałeś." Milknie na chwilę, po czym opowiada: kiedyś należał
              do stada które przegnano gdy Królowa wycięła las pod nowe pola.
              Odtąd ukrywa się z dala od ludzi.
            flags: {centaur_wywabiony: true, centaur_state: wywabiony}
            inventory_add: ["księga run", "historia centaura"]
            inventory_remove: ["kostki cukru"]
          - id: wywabienie_po_zaufaniu
            requires: {inventory: "kostki cukru", flags_all: {centaur_ufa: true}}
            allow_talk: true
            action_hint: "gracz musi zaoferować, dać lub rzucić kostki cukru centaurowi — imię Arianny nie musi już paść, bo centaur mu wcześniej zaufał"
            trigger: "gracz oferuje, daje lub rzuca centaurowi kostki cukru"
            outcome: |
              Centaur już ci ufa, bo wspomniałeś Ariannę. Widzi cukier w twojej
              dłoni i powoli wychodzi z gąszczu. "Skoro znasz Ariannę..." — mruczy,
              biorąc cukier. Sięga za pazuchę i podaje ci starą, oprawioną w skórę
              księgę. "To księga run. Będziesz jej potrzebował. Zaklęta — sama
              zapisuje historie tych, których spotkasz w tym lesie, więc niczego
              nie zapomnisz. Przypomni sobie nawet to, czego już się dowiedziałeś,
              zanim ją dostałeś." Milknie na chwilę, po czym opowiada: kiedyś należał
              do stada które przegnano gdy Królowa wycięła las pod nowe pola.
              Odtąd ukrywa się z dala od ludzi.
            flags: {centaur_wywabiony: true, centaur_state: wywabiony}
            inventory_add: ["księga run", "historia centaura"]
            inventory_remove: ["kostki cukru"]
          - id: o_czarodziejce
            exact_sequence: [["czarodziejka", "czarodziejkę", "czarodziejki", "czarodziejce"], "imienia", "nikt", "nie", "zna"]
            trigger: "gracz pyta centaura o Czarodziejkę, której imienia nikt nie zna"
            outcome: |
              Centaur pochyla głowę. "Czarodziejka? To dobra, piękna pani.
              Kocha wszystkich odmieńców — takich jak ja. Właśnie dlatego
              musiała uciekać na pustynię, daleko od Królowej."
            flags: {}
        no_match_messages:
          - "Centaur cofa się głębiej w gąszcz, nieufny."
          - "Coś poruszyło się w krzakach, ale centaur nie wychodzi."
          - "Centaur obserwuje cię z ukrycia, ale się nie zbliża."
        creative_solutions_hint: |
          Centaur wyjdzie gdy gracz zaoferuje cukier PO tym jak wcześniej wspomniał
          imię Arianny (w tej samej wiadomości albo we wcześniejszej turze) — samo
          jedzenie albo samo imię, bez tego drugiego elementu w ogóle, nie wystarczy.
    atmosphere: "gęste krzaki, szelest liści, coś dużego ukrywającego się w cieniu"

