      required: ["północ", "południe", "północ", "zachód", "wschód"]
      neutral_text: |
        Piasek wiruje wokół ciebie, wiatr zagłusza każdy dźwięk. Nie widzisz
        nic poza ścianą pyłu — trudno powiedzieć, czy w ogóle idziesz we
        właściwą stronę.
      fail_narrative: |
        Wiatr nagle cichnie. Otrzepujesz piasek z twarzy i widzisz przed sobą
        znajomy widok — stoisz z powrotem przy wejściu na burzowe piaski.
        Burza sama zdecydowała, że nie tędy droga.
      fail_target: wejscie_burzowe_piaski
      success_target: wejscie_podziemi
      solved_flag: burza_pokonana
    exits:
      północ: wejscie_podziemi
      wschód: wejscie_burzowe_piaski
    items: []
    npcs: []
    atmosphere: "dezorientująca burza, wiatr, piasek wszędzie"

  wejscie_podziemi:
