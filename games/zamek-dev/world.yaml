          - "Ivan kręci głową. \"Nie jestem jeszcze przekonany, że jesteś gotów.\""
          - "Ivan tylko unosi brew, niewzruszony."
        creative_solutions_hint: |
          Jedyne co tu oceniasz: czy gracz oferuje/daje próbkę Ivanowi albo prosi
          o pomoc/teleportację. Wymóg 4 historii jest już sprawdzony wcześniej
          (dlatego czasem ta opcja w ogóle się nie pojawia) — NIE weryfikuj go
          ponownie na podstawie treści wiadomości gracza.
    atmosphere: "zapach ziół i magii, ciepłe światło świec, cisza skupienia"

  pustynia:
