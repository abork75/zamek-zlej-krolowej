  wnetrze_chatki_ivana:
    name: "Chatka Czarownika Ivana"
    image_variants:
      - file: "chatka_ivana"
        base: true
        condition: null
        label: "Wnętrze chatki Ivana"
        prompt_extra: "wnętrze małej magicznej chatki, półki pełne słoików z dziwnymi substancjami, stary czarownik w fioletowej szacie przy stole zawalonym księgami, świecące runy na ścianach"
    description_variants:
      - condition: {flag: ivan_wskazal_droge, value: true}
        description: |
          Wnętrze chatki wypełnia zapach ziół i czegoś ostrzejszego, magicznego.
          Ivan siedzi przy stole, znów pochylony nad księgami. Podnosi wzrok
          na chwilę. "Nie trać czasu — idź na polanę i wypowiedz zaklęcie.
          Ona czeka." Wraca do swoich ksiąg.
      - condition: null
        description: |
          Wnętrze chatki wypełnia zapach ziół i czegoś ostrzejszego, magicznego.
          Przy stole zawalonym księgami siedzi stary czarownik w fioletowej
          szacie — Ivan. Podnosi wzrok, jakby cię oczekiwał. "Więzień Benedykt
          wspominał o tobie" — mówi, odkładając pióro. "Usiądź. Powiedz, czego
          się dowiedziałeś w tym lesie, i pokaż mi tę próbkę, jeśli już ją masz."
    exits:
      wyjście: polana_ivana
    items: []
    npcs:
      - id: ivan
        name: "Czarownik Ivan"
        description: |
          Stary, przenikliwy czarownik. Bada magię od dekad. Interesuje go
          próbka substancji którą przynosi gracz — chce wiedzieć do jakiego
          zaklęcia Królowa jej używa, ale sam jeszcze nie wie i będzie musiał
          zbadać. Nie zgodzi się teleportować gracza dalej dopóki ten nie
          pozna historii wszystkich mieszkańców lasu (centaur, driada, kobold,
          dziad) — twierdzi że każda z nich to fragment większej układanki.
        state: "oczekuje"
        scripted_solutions:
          - id: niepelna_wiedza
            requires: {inventory_missing: "próbka substancji"}
            allow_talk: true
            trigger: "gracz próbuje rozmawiać z Ivanem, prosi o pomoc, pyta o teleportację"
            outcome: |
              Ivan kręci głową. "Nie masz nawet próbki. Wróć gdy będziesz
              gotów — i gdy poznasz historie mieszkańców tego lasu. Każda
              ich opowieść ma znaczenie."
            flags: {}
            list_story_progress: historie_lasu
          - id: teleportacja
            requires:
              inventory: "próbka substancji"
              inventory_all: ["historia centaura", "historia driady", "historia kobolda", "historia dziada"]
            allow_talk: true
            trigger: "gracz daje próbkę Ivanowi lub prosi o pomoc/teleportację"
            outcome: |
              Ivan bierze próbkę, wącha ją, mruży oczy, a potem sięga po
              księgę run i chowa oboje do szuflady. "To gorsze niż
              myślałem. Sam tego nie rozwiążę — potrzebuję pomocy Czarodziejki,
              której imienia nikt nie zna. Ukrywa się na pustyni, daleko stąd,
              odkąd uciekła przed Królową." Podchodzi do okna i wskazuje na
              północ. "Idź na magiczną polanę i wypowiedz tam zaklęcie: Rub dub
              gub. Zaniesie cię do niej. A jeśli masz jeszcze chwilę — driada
              Arianna i centaur Chiron też coś wiedzą o czarodziejce. Warto ich
              jeszcze zapytać, zanim odejdziesz."
            flags: {ivan_wskazal_droge: true}
            inventory_remove: ["próbka substancji", "księga run", "historia centaura", "historia driady", "historia kobolda", "historia dziada"]
          - id: brakuje_historii
            requires:
              inventory: "próbka substancji"
              inventory_any_missing: ["historia centaura", "historia driady", "historia kobolda", "historia dziada"]
            allow_talk: true
            trigger: "gracz daje próbkę Ivanowi lub prosi o pomoc/teleportację"
            outcome: |
              Ivan bierze próbkę do ręki, ale nie spieszy się z niczym.
              "Zaczekaj. Wciąż nie znasz wszystkich historii mieszkańców tego
              lasu. Beze mnie i tak nic nie zrozumiesz, dopóki nie zrozumiesz
              ich." Oddaje ci próbkę z powrotem.
            flags: {}
            list_story_progress: historie_lasu
        no_match_messages:
