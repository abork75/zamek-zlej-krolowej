    items: []
    npcs: []
    atmosphere: "gęstniejący wiatr, piasek smagający twarz"

  burzowe_piaski:
    name: "Burzowe Piaski"
    image_variants:
      - file: "burzowe_piaski"
        base: true
        condition: null
        label: "Wnętrze burzy piaskowej"
        prompt_extra: "gęsta burza piaskowa, widoczność ograniczona do kilku metrów, wirujący piasek zasłaniający wszystko, dezorientująca, mistyczna atmosfera"
    description: |
      Wchodzisz w burzę piaskową. Widoczność spada do kilku kroków, wiatr
