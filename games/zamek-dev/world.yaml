  kobold:
    name: "Kryjówka Kobolda"
    image_variants:
      - file: "kobold_nakarmiony"
        condition: {flag: kobold_nakarmiony, value: true}
        label: "Kobold najedzony"
        prompt_extra: "mały, zielonoskóry kobold siedzący zadowolony, przy nim resztki ryby, leśna polanka"
      - file: "kobold"
        base: true
        condition: null
        label: "Kobold głodny"
        prompt_extra: "mały, chudy, zielonoskóry kobold z wielkimi oczami, wygląda na głodnego, siedzi na leśnej polance otoczonej korzeniami"
    description: |
      Mała polanka między korzeniami starego drzewa. Siedzi tu kobold —
      chudy, zielonoskóry, z wielkimi, głodnymi oczami. "Jeeeść..." — jęczy,
      patrząc na ciebie wyczekująco.
    exits:
      południe: las01
      zachód: centaur
      północ: lesny_dziad
      wschód: las02
    items: []
    npcs:
      - id: kobold
        name: "Kobold"
        description: |
          Mały, głodny kobold. Chce coś specjalnego do jedzenia, ale sam nie
          potrafi powiedzieć czego dokładnie — trzeba zgadnąć (ryba ze stawu).
          Zwykłe jedzenie go nie zadowoli.
        state: "glodny"
        unavailable_states:
          nakarmiony: "Kobold siedzi zadowolony, głaszcząc się po brzuchu."
        scripted_solutions:
          - id: nakarmienie
            requires: {inventory: "ryba"}
            allow_talk: true
            action_hint: "gracz musi wyraźnie dać/nakarmić kobolda rybą (nawet pytająco/oferując) — samo posiadanie ryby nie wystarczy"
            trigger: "gracz daje, karmi, wręcza lub proponuje (nawet pytająco) koboldowi rybę"
            outcome: |
              Oczy kobolda robią się wielkie jak spodki. Rzuca się na rybę
              i pożera ją w kilka sekund. "Aaaach... dobre." Zadowolony,
              zniża głos: "Dam ci coś za to. Znam słowa, które mogą ci się
              przydać u starego dziada na moście." Potem opowiada: był
              kiedyś sługą w zamku, uciekł do lasu gdy Królowa zaczęła
              karać sługi za byle przewinienie.
            flags: {kobold_nakarmiony: true}
            inventory_remove: ["ryba"]
            inventory_add: ["historia kobolda"]
            reveals_riddle_hints: dziad_zagadki
            max_riddle_hints: 3
            no_hints_fallback: "Ale widzę, że już wszystkie rozwiązałeś sam — nie mam ci nic do dodania. Za to powiem ci coś innego: centaur w gąszczu ma starą księgę run. Dzięki niej odczytasz napisy wyryte na drzewach w głębi lasu — a te podobno mówią, jak odsłonić coś ukrytego na magicznej polanie."
          - id: powtorz_historie
            requires: {flag: kobold_nakarmiony, value: true}
            allow_talk: true
            trigger: "gracz pyta kobolda o jego historię, przeszłość, kim jest, prosi żeby powtórzył"
            outcome: |
              Kobold drapie się po brzuchu. "Już mówiłem — byłem sługą w
              zamku. Uciekłem do lasu gdy Królowa zaczęła karać sługi za
              byle przewinienie." Wzrusza ramionami. "Nic więcej nie wiem."
            flags: {}
        no_match_messages:
          - "Kobold tylko patrzy na ciebie wyczekująco, jęcząc z głodu."
          - "Kobold nie odpowiada wprost — tylko głośno burczy mu w brzuchu."
          - "Kobold milczy, przełykając ślinę na sam widok czegokolwiek jadalnego."
        creative_solutions_hint: |
          Kobold chce konkretnie ryby ze stawu — nic innego go nie zadowoli,
          nawet inne jedzenie.
    atmosphere: "korzenie starego drzewa, cichy jęk głodnego kobolda"

  polana_ivana:
    name: "Magiczna Polana"
    image_variants:
      - file: "polana_ivana_odkryta"
        condition: {flag: chatka_ivana_odkryta, value: true}
        label: "Polana — chatka widoczna"
        prompt_extra: "magiczna leśna polana, pośrodku mała drewniana chatka czarownika otoczona świecącymi runami, mistyczna mgła, fioletowe światło"
      - file: "polana_ivana"
        base: true
        condition: null
        label: "Polana — chatka niewidoczna"
        prompt_extra: "magiczna leśna polana, pusta pośrodku, w powietrzu wyczuwalna magia, delikatna mgła, drzewa z dziwnymi symbolami dookoła"
    description: |
      Magiczna polana. Powietrze mieni się delikatnie, jakby coś tu było
      ukryte. Pośrodku pustka — ale czujesz, że to złudzenie.
    exits:
      południe: lesny_dziad
      północ: las04
      wejście:
        target: wnetrze_chatki_ivana
        requires: {flag: chatka_ivana_odkryta, value: true}
        hidden: true
        blocked_message: "Nie widzisz żadnego wejścia — tylko pustą polanę."
    items: []
    npcs:
      - id: magiczna_polana
        name: "Zaklęta Pustka"
        is_object: true
        description: |
          Pustka pośrodku polany skrywa chatkę czarownika Ivana pod zaklęciem.
          WAŻNE: chatka pojawia się WYŁĄCZNIE gdy gracz wypowie kolory
          DOKŁADNIE w tej kolejności: czarny, zielony, czerwony, fiołkowy,
          złoto. Żadna inna kombinacja, kolejność ani pominięcie koloru nie
          działa. NIGDY nie podpowiadaj ani nie zdradzaj kolejności.
          Po rozmowie z Ivanem to samo miejsce służy też do przywołania
          zaklęcia "Rub dub gub", które przenosi gracza na pustynię — ale
          działa TYLKO gdy Ivan już wskazał drogę (nie wcześniej).
        state: "zaklete"
        scripted_solutions:
          - id: poprawna_kolejnosc
            exact_sequence: ["czarny", "zielony", "czerwony", "fiołkowy", ["złoty", "złoto"]]
            action_hint: "gracz musi wypowiedzieć WSZYSTKIE pięć kolorów w DOKŁADNIE tej kolejności: czarny, zielony, czerwony, fiołkowy, złoto — brak koloru, dodatkowy kolor lub inna kolejność to NIE jest dopasowanie"
            trigger: "gracz wypowiada kolory w kolejności: czarny, zielony, czerwony, fiołkowy, złoto"
            outcome: |
              Powietrze drży. Kolory zdają się rozbłyskiwać jeden po drugim
              w rytm twoich słów. Z pustki wyłania się mała, drewniana chatka
              otoczona świecącymi runami — jakby zawsze tam była, tylko
              niewidoczna.
            flags: {chatka_ivana_odkryta: true}
          - id: zaklecie_pustyni
            exact_sequence: ["rub", "dub", "gub"]
            requires: {flag: ivan_wskazal_droge, value: true}
            action_hint: "gracz musi wypowiedzieć dokładnie zaklęcie 'Rub dub gub' — działa TYLKO gdy Ivan już wskazał drogę na pustynię"
            trigger: "gracz wypowiada zaklęcie 'Rub dub gub'"
            outcome: |
              Powietrze wiruje gwałtownie — silniej niż poprzednio. Ziemia
              pod stopami znika w wirze światła i piasku. Świat rozmywa się
              i po chwili otwierasz oczy gdzie indziej.
            flags: {ivan_teleportuje: true}
            move_to: pustynia
        no_match_messages:
          - "Powietrze lekko drży, ale nic więcej się nie dzieje."
          - "Kolory jakby się poruszyły w powietrzu, ale polana pozostaje pusta."
          - "Nic się nie zmienia. Polana wygląda tak samo jak wcześniej."
    atmosphere: "mistyczna cisza, delikatna mgła, wyczuwalna magia w powietrzu"

