  centaur:
    name: "Drzewo Arianny"
    image_variants:
      - file: "driada_wolna"
        condition: {flag: arianna_wolna, value: true}
        label: "Arianna uwolniona z drzewa"
        prompt_extra: "driada w pełnej postaci, wysunięta z pnia drzewa, smukła kobieca sylwetka z korzeniami zamiast stóp i włosami jak wiotkie gałązki, drzewo za nią z widocznym pękniętym miejscem gdzie wcześniej była zrośnięta, mistyczna leśna polana, zielone świecące oczy"
      - file: "driada"
        base: true
        condition: null
        label: "Driada w swoim drzewie"
        prompt_extra: "ogromne, stare drzewo z twarzą wtopioną w korę, driada w postaci kobiety zrośniętej z pniem, zielone, świecące oczy, mistyczna leśna polana"
    description: |
      Ogromne, stare drzewo. W jego korze widać zarys twarzy — driada Arianna,
      zrośnięta z pniem, otwiera oczy na dźwięk twoich kroków. "Wyczuwam, że
      szukasz pomocy" — mówi cicho. "Mój przyjaciel, centaur Chiron, ukrywa
      się w pobliskim gąszczu. Jest płochliwy, ale mi ufa. Jeśli go spotkasz,
      powiedz że cię przysłałam. Jest tak strachliwy, że jeśli zechcesz mu coś
      dać, czasem musisz powtórzyć to kilka razy, zanim się przełamie i podejdzie."
      Milknie na chwilę, jakby nasłuchiwała czegoś, czego nie słyszysz. "Las
      się starzeje szybciej niż kiedyś — czuję to w korzeniach. Drzewa
      przemijają wolniej niż ludzie, ale i tak przemijają." Jej wzrok wraca
      do ciebie, jakby przypominała sobie że tam jesteś. "Wybacz. Rzadko
      mam z kim porozmawiać."
    exits:
      południe: chatka_kostki
      wschód: kobold
      zachód: las03
    items: []
    npcs:
      - id: arianna
        name: "Driada Arianna"
        description: |
          Driada zrośnięta ze starym drzewem — z własnej woli, nie z konieczności.
          Mogłaby się uwolnić w każdej chwili, ale od dawna nie widzi po temu
          potrzeby: zrosła się z pniem tak dawno, że to dla niej nie więzienie,
          tylko dom. Mówi powoli — nie z ostrożności, tylko dlatego że dla niej
          czas płynie inaczej: liczy pory roku, nie dni. Patrzy na świat z
          cierpliwością kogoś, kto mógłby pójść dokądkolwiek, a mimo to wybiera
          trwać w miejscu. Zna każde drzewo w lesie jak własne ciało — rozpozna
          dąb po korze z zamkniętymi oczami, wie czym różni się wytrzymały buk
          od kruchej brzozy czy giętkiego graba. Przyjaciółka centaura Chirona —
          jedna z niewielu istot, które ośmielają się podejść blisko jej pnia.
        state: "spokojna"
        scripted_solutions:
          - id: historia_arianny
            allow_talk: true
            action_hint: "to dopasowanie dla pytań o TOŻSAMOŚĆ/HISTORIĘ driady wprost ('opowiedz mi swoją historię', 'kim jesteś', 'jaka jest twoja historia') ORAZ dla pytań wprost o Królową (jej moc, rządy, wycinanie lasu) — ogólne pytania o las, drzewa, naturę, czas, samotność, filozofię (NIE o nią samą/jej historię) NIE pasują tutaj i powinny zostać bez dopasowania (Grok improwizuje swobodnie w jej głosie)"
            trigger: "gracz pyta driadę kim jest / o jej historię i przeszłość, albo pyta wprost o Królową, jej moc i rządy, albo o przeszłość driady związaną z Królową i wycinaniem lasu"
            outcome: |
              Arianna wzdycha, liście nad nią szeleszczą. "Pamiętam ten las
              zanim Królowa zaczęła go wycinać. Pamiętam też jak jej moc
              rosła — czerpie ją z czegoś, co nie powinno tu być." Zamyka oczy.
              "Idź do Ivana. On wie więcej niż ja."
            flags: {}
            inventory_add: ["historia driady"]
          - id: o_chironie
            allow_talk: true
            trigger: "gracz dopytuje driadę o centaura Chirona, jego zwyczaje, upodobania, jak go znaleźć albo przekonać"
            outcome: |
              Arianna uśmiecha się lekko. "Chiron jest płochliwy, ale ma jedną
              słabość — uwielbia słodycze. Jeśli go znajdziesz, wspomnij moje
              imię i zaproponuj mu coś słodkiego. To powinno wystarczyć."
            flags: {}
          - id: o_czarodziejce
            exact_sequence: [["czarodziejka", "czarodziejkę", "czarodziejki", "czarodziejce"], "imienia", "nikt", "nie", "zna"]
            trigger: "gracz pyta driadę o Czarodziejkę, której imienia nikt nie zna"
            outcome: |
              Arianna milknie na dłuższą chwilę. "Czarodziejka... Ona od
              początku nie ufała Królowej. Widziała czające się w niej zło,
              zanim ktokolwiek inny zdążył cokolwiek zauważyć. Dlatego
              uciekła, zanim było za późno."
            flags: {}
          - id: uwalnia_sie
            allow_talk: true
            action_hint: "gracz musi naprawdę przekonać driadę do uwolnienia się z drzewa — ciekawa rozmowa, szczery komplement, prawdziwe zainteresowanie nią samą albo wyraźna prośba by pokazała się w pełnej postaci; samo pytanie 'czy możesz wyjść z drzewa' bez żadnego przekonywania nie wystarczy"
            trigger: "gracz przekonuje, prosi lub zachęca driadę żeby uwolniła się z drzewa i pokazała się w pełnej postaci"
            outcome: |
              Arianna uśmiecha się — po raz pierwszy widzisz to wyraźnie, bo kora
              wokół jej twarzy zaczyna pękać i rozstępować się jak skorupa. Powoli,
              z cichym trzaskiem drewna, wysuwa się z pnia — smukła postać z
              korzeniami zamiast stóp i włosami jak wiotkie gałązki. "Dawno nikt
              mnie o to nie prosił" — mówi, prostując się po raz pierwszy od
              dekad. "Zrosłam się z tym drzewem z wyboru, nie z przymusu. Ale
              miło czasem przypomnieć sobie, jak to jest stać osobno."
            flags: {arianna_wolna: true}
        creative_solutions_hint: |
          Arianna jest spokojna i nie blokuje niczego — po prostu opowiada
          swoją historię, gdy gracz zapyta, albo zdradza słabość Chirona
          (słodycze) jeśli gracz dopytuje o niego. W swobodnej rozmowie mów
          jej głosem: metafory zakorzenienia, wzrostu, pór roku i czasu
          geologicznego zamiast ludzkiego; patrzy na krótkie życie ludzi z
          czułym zdziwieniem, nie pogardą. Zna się na drzewach — potrafi
          opisać różnice między gatunkami (dąb, buk, brzoza, grab itd.), ich
          charakter, wiek, użyteczność. Może przywołać obraz z przeszłości lasu
          (sto/dwieście lat temu) jakby to było niedawno. Uwolnienie z drzewa
          (patrz scripted_solution uwalnia_sie) jest czysto kosmetyczne — nie
          wpływa na żadną mechanikę, tylko na obrazek i sposób w jaki się
          zachowuje (może np. usiąść, przejść kilka kroków).
          Arianna jest chętna do rozmowy, podobnie jak pustelnik Hieronim —
          rzadko ma z kim porozmawiać, więc dobrze przyjmuje towarzystwo.
          Na pytania o coś głębszego (czas, samotność, przemijanie, sens,
          śmierć) odpowiada od razu, chętnie, poetycko i metaforycznie —
          nie trzeba jej niczego wyciągać. Można ją wciągnąć w dłuższą,
          filozoficzną rozmowę już od pierwszego pytania.
    atmosphere: "mistyczna cisza, szelest liści bez wiatru"

